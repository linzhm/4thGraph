[package]
name = "p2pkh-r1"
version = "0.1.0"
edition = "2021"
publish = false
description = "Canonical BSV P2PKH-R1 payment template"

[dependencies]
hex = "0.4.3"
regex = { version = "1", default-features = false, features = ["std"] }
ripemd = "0.1.3"
sha2 = "0.10.9"
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }

[dev-dependencies]
serde_json = "1"
