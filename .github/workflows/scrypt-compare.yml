name: Compare the sCrypt P-256 test contract
on:
  push:
    branches: [research/pels-transaction-bounds]
    paths: ['research/scrypt-compare/**', '.github/workflows/scrypt-compare.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CASE: ${{ contains(github.event.head_commit.message, '[verify-only]') && 'verifyOnly' || 'secp256r1' }}
      GHCRTS: '-N2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sCrypt-Inc/scrypt-ts-lib
          ref: fc71404fb82bc513dba3908bf47fc231a169787c
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the upstream locked dependencies and compile its library
        working-directory: upstream
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx --yes scrypt-cli@0.2.3 compile --asm --noArtifact
          python ../research/scrypt-compare/check-optimization.py
      - name: Compile the selected test harness
        working-directory: upstream/tests
        run: |
          if [[ "$CASE" == "verifyOnly" ]]; then
            cp ../../research/scrypt-compare/verifyOnly.ts contracts/heavy/verifyOnly.ts
          fi
          npx --yes scrypt-cli@0.2.3 compile --include "contracts/heavy/$CASE.ts" --exclude __none__
          test -s "artifacts/contracts/heavy/$CASE.json"
      - name: Measure serialized scripts with the public R1 vector
        working-directory: upstream
        run: |
          artifact="tests/artifacts/contracts/heavy/$CASE.json"
          test -n "$artifact"
          node --max-old-space-size=6500 ../research/scrypt-compare/measure.cjs "$artifact" ../template/spend-all.json
      - name: Preserve the measured scripts
        uses: actions/upload-artifact@v4
        with:
          name: measured-script-bytes
          path: |
            ${{ runner.temp }}/scrypt-lock.bin
            ${{ runner.temp }}/scrypt-unlock.bin
            ${{ runner.temp }}/pels-lock.bin
            ${{ runner.temp }}/pels-unlock.bin
          retention-days: 7
      - name: Check both inputs on an isolated BSV Node 1.2.3
        run: |
          sed -e 's/-maxtxsizepolicy=100000000/-maxtxsizepolicy=100000000 -maxscriptsizepolicy=6000000/' \
              -e 's/-maxstdtxvalidationduration=1000 /-maxstdtxvalidationduration=10000 /' \
              -e 's/-maxnonstdtxvalidationduration=2000 /-maxnonstdtxvalidationduration=11000 /' \
              -e 's|python -m unittest -v test_payment|python research/scrypt-compare/native.py|' reference/verify.sh > "$RUNNER_TEMP/compare-native.sh"
          bash "$RUNNER_TEMP/compare-native.sh"
