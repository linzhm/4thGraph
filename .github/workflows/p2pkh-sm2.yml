name: P2PKH-SM2 conformance
# Development tests run in a cloud Linux environment or Apple Container.
# Keep Actions manual to avoid duplicate push/PR runs.
on:
  workflow_dispatch:

permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned engine and verify its provenance
        run: |
          python -m pip install -r projects/p2pkh-sm2/reference/requirements.txt
          python - <<'PY'
          from fourthgraph.bsv.differential import require_chain_gang_pin
          print('Verified chain-gang commit', require_chain_gang_pin('projects/p2pkh-sm2/reference/requirements.txt'))
          PY
          python -m unittest tests.test_differential -v
      - name: Standard vectors, OpenSSL and adversarial cases
        run: python -m unittest discover -s projects/p2pkh-sm2/reference -p test_sm2.py -v
      - name: Project layout and generated documentation
        run: |
          python -m pip install -r tools/requirements-docs.txt
          python -m unittest tests.test_layout tests.test_project_docs -v
      - name: Complete spends in BSV Node and chain-gang
        working-directory: projects/p2pkh-sm2/reference
        run: bash verify.sh
