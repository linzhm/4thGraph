name: P2PKH-SM2 conformance
# Development tests run in a cloud Linux environment or Apple Container.
# Keep Actions manual to avoid duplicate push/PR runs.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reference dependencies
        working-directory: projects/p2pkh-sm2/reference
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          import json
          from importlib.metadata import distribution
          source = json.loads(distribution('tx-engine').read_text('direct_url.json'))
          assert source['vcs_info']['commit_id'] == '5cb8c6e410dbfad1c619cec3ca54d1bcaacd4eb7'
          PY
      - name: Standard vectors, OpenSSL and adversarial cases
        run: python -m unittest discover -s projects/p2pkh-sm2/reference -p test_sm2.py -v
      - name: Project layout and unchanged R1 template
        run: python -m unittest shared.test_layout -v
      - name: Complete spends in BSV Node and chain-gang
        working-directory: projects/p2pkh-sm2/reference
        run: bash verify.sh
