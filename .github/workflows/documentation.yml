name: Update project READMEs

on:
  push:
    branches: ['**']
    paths:
      - 'projects/*/manifest.yaml'
      - 'projects/*/versions/index.json'
      - 'projects/*/versions/v*/manifest.json'

permissions:
  contents: write

jobs:
  readmes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Find changed projects
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=$BASE_SHA
          if [[ $base =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA")
          fi
          paths=$(git diff --name-only "$base" "$GITHUB_SHA" -- \
            ':(glob)projects/*/manifest.yaml' \
            ':(glob)projects/*/versions/index.json' \
            ':(glob)projects/*/versions/v*/manifest.json')
          projects=()
          while IFS=/ read -r _root project kind version _file; do
            [[ $project =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && $project != template ]] || continue
            directory="projects/$project"
            if [[ ! -f "$directory/manifest.yaml" ]]; then
              if [[ -f "$directory/versions/index.json" ]]; then
                echo "::error file=$directory/manifest.yaml::A runnable project needs manifest.yaml"
                exit 1
              fi
              continue
            fi
            if [[ $kind == versions && $version == v* ]]; then
              current=$(jq -r .current "$directory/versions/index.json")
              [[ $version == "v$current" ]] || continue
            fi
            projects+=("$project")
          done <<< "$paths"
          if (( ${#projects[@]} )); then
            names=$(printf '%s\n' "${projects[@]}" | sort -u | paste -sd ' ')
            printf 'projects=%s\n' "$names" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.projects != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt
      - name: Generate and commit affected READMEs
        if: steps.changed.outputs.projects != ''
        env:
          CHANGED_PROJECTS: ${{ steps.changed.outputs.projects }}
        run: |
          python -m pip install -r tools/requirements-docs.txt
          read -r -a projects <<< "$CHANGED_PROJECTS"
          for attempt in 1 2; do
            start=$(git rev-parse HEAD)
            for project in "${projects[@]}"; do
              python tools/project_readme.py "$project" --write
              git add -- "projects/$project/README.md" "projects/$project/README.zh-CN.md"
            done
            if git diff --cached --quiet; then
              exit 0
            fi
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Regenerate project READMEs'
            if git push origin "HEAD:$GITHUB_REF"; then
              exit 0
            fi
            if (( attempt == 2 )); then
              exit 1
            fi
            git fetch origin "$GITHUB_REF"
            if [[ $(git rev-parse FETCH_HEAD) == "$start" ]] ||
              ! git merge-base --is-ancestor "$start" FETCH_HEAD; then
              exit 1
            fi
            git switch --detach FETCH_HEAD
          done
