name: P2PKH-R1 conformance
on:
  push:
    branches: [research/pels-transaction-bounds]
    paths: ['sdk/**', 'reference/**', 'template/**', '.github/workflows/p2pkh-r1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: TypeScript vectors
        working-directory: sdk/typescript
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Go vectors
        working-directory: sdk/go
        run: |
          go mod download golang.org/x/crypto
          go test ./...
      - name: Rust vectors
        working-directory: sdk/rust
        run: cargo test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and verify payments on BSV Node and chain-gang
        working-directory: reference
        run: |
          python -m pip install -r requirements.txt
          python -c 'from importlib.metadata import distribution; import json; print(json.loads(distribution("tx-engine").read_text("direct_url.json"))["vcs_info"]["commit_id"])' | grep -Fx e129e5a0a914614473556bab3f25906d55a4a680
          bash verify.sh
