[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourthgraph"
dynamic = ["version"]
description = "A Forth compiler for BSV Script and multi-transaction workflows"
requires-python = ">=3.11"

[project.scripts]
4thgraph = "fourthgraph.workflow.protocol:main"
4thgraph-report = "fourthgraph.reporting:main"
4thgraph-circuit = "fourthgraph.verification.circuit_backend:main"
4thgraph-verify = "fourthgraph.verification.plan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fourthgraph.PROJECT_VERSION"}

[tool.setuptools.package-data]
"fourthgraph.stdlib" = ["*.fth", "wallet/*.fth"]
"fourthgraph.workflow" = ["*.fs", "*.fth"]
"fourthgraph.verification" = ["*.go"]
"fourthgraph.benchmark" = ["formulas/*.fth"]
