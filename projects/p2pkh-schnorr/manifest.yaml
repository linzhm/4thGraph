$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: P2PKH-Schnorr
  zh-CN: P2PKH-Schnorr
summary:
  en: Create a BSV payment lock from the HASH160 of a BIP340 x-only public key. The key is 32 bytes, the
    owner hash is 20 bytes, and the external signer returns a 64-byte BIP340 signature. This is an experimental
    payment template. [BIP340](https://github.com/bitcoin/bips/blob/master/bip-0340.mediawiki)
  zh-CN: 在 BSV 上向 BIP340 x-only 公钥的 HASH160 付款。公钥为 32 字节，所有者哈希为 20 字节，外部签名器返回 64 字节 BIP340 签名。这是一个实验付款模板。[BIP340](https://github.com/bitcoin/bips/blob/master/bip-0340.mediawiki)
entry_points:
  - name: bip340-verify ( script -- script )
    description:
      en: Build a detached verifier. At execution it accepts a byte message, public key x and y, a BIP340
        signature, and the nonce point's y coordinate.
      zh-CN: 构造独立验签器。执行时接收字节消息、公钥 x 和 y、BIP340 签名及 nonce 点的 y 坐标。
  - name: schnorr-lock ( script bytes -- script )
    description:
      en: Build a payment lock from a 20-byte owner hash. The lock checks ownership, verifies the BIP340
        signature, and binds the signed digest to the current input.
      zh-CN: 用 20 字节所有者哈希构造付款锁。执行时校验所有者和 BIP340 签名，并把已签摘要绑定到当前输入。
  - name: schnorr-unlock
    description:
      en: Build the input script from the signed preimage, mode selector, signature, and public coordinate
        witnesses.
      zh-CN: 用签名预映像、模式选择值、签名和公开坐标见证构造解锁脚本。
setup:
  en:
    - <a name="validate-the-baseline"></a>
    - Run from the repository root with Python 3.12. The SDK replay also uses Node.js 24, Go, and Rust/Cargo.
      The suites use public fixture keys and replay against pinned chain-gang and an isolated BSV Node
      regtest.
    - |-
      ```sh
      bash tools/setup-workspaces.sh
      python3.12 -m venv projects/p2pkh-schnorr/workspace/p2pkh-schnorr
      projects/p2pkh-schnorr/workspace/p2pkh-schnorr/bin/python -m pip install -r projects/p2pkh-schnorr/reference/requirements.txt
      . projects/p2pkh-schnorr/workspace/p2pkh-schnorr/bin/activate
      export SCRIPT_LAB_SDK_PYTHON="$VIRTUAL_ENV/bin/python"
      ```
  zh-CN:
    - <a name="复现验收"></a>
    - 在仓库根目录使用 Python 3.12。SDK 复放还用到 Node.js 24、Go 和 Rust/Cargo。测试使用公开夹具密钥、固定版本的 chain-gang 及隔离的 BSV Node
      regtest。
    - |-
      ```sh
      bash tools/setup-workspaces.sh
      python3.12 -m venv projects/p2pkh-schnorr/workspace/p2pkh-schnorr
      projects/p2pkh-schnorr/workspace/p2pkh-schnorr/bin/python -m pip install -r projects/p2pkh-schnorr/reference/requirements.txt
      . projects/p2pkh-schnorr/workspace/p2pkh-schnorr/bin/activate
      export SCRIPT_LAB_SDK_PYTHON="$VIRTUAL_ENV/bin/python"
      ```
sections:
  use_cases:
    en:
      - The wallet defaults to the published v0.17.0 template. Use the SDK for receiving, spending
        and authenticating previous outputs. [Wallet SDK](docs/sdk.en.md#quickstart) · [Version index](versions/index.json)
      - Two participants can authorize the same lock through a BIP327 aggregate key. The external
        signer manages the signing session. [MuSig2 and native 2-of-2](docs/threshold-comparison.en.md)
      - The high-level 64-window Forth experiment records the current automatic build and constructor
        replay. [OTDA measurements](docs/high-level-forth.en.md#otda-constructor) · [Optimization history](docs/high-level-forth.en.md#optimization-history)
    zh-CN:
      - 钱包默认使用已发布的 v0.17.0 模板。收款、花费和核验上一输出通过 SDK 完成。[钱包 SDK](docs/sdk.zh-CN.md#quickstart) · [版本目录](versions/index.json)
      - 两方可以用 BIP327 聚合公钥共同授权同一个锁，签名会话由外部签名器管理。[MuSig2 与原生 2-of-2](docs/threshold-comparison.zh-CN.md)
      - 高阶 Forth 实验记录 64 窗口自动构建和构造器的当前复放结果。[OTDA 实测](docs/high-level-forth.zh-CN.md#otda-constructor) · [优化历史](docs/high-level-forth.zh-CN.md#optimization-history)
  algorithm:
    en:
      - |-
        1. Parse the BIP340 signature as `r || s` and check the coordinate bounds, even ordinates, public-point equation, and scalar bound.
        2. Hash the original `r`, x-only public key and message with the BIP340 tag, then reduce the hash modulo the group order to obtain `e`.
        3. Evaluate `sG − eP` with 64 two-bit windows. Require a nonzero projective Z and compare both coordinates with the even nonce point.
      - The payment wrapper checks the public-key hash and binds the verified message to the actual input.
        The released verifier uses coordinate scaling, paired doubling and secp256k1 GLV.
        [Payment protocol and curve formulas](docs/spec.en.md) · [Forth payment source](forth/schnorr.fth)
      - <a name="secp256k1-arithmetic"></a>
      - Contracts performing secp256k1 point arithmetic in Script can reuse these curve kernels.
        [secp256k1 library](../../src/fourthgraph/stdlib/secp256k1.fth)
    zh-CN:
      - |-
        1. 将 BIP340 签名读为 `r || s`，检查坐标范围、纵坐标偶性、公钥点曲线方程和标量范围。
        2. 用原始 `r`、x-only 公钥和消息计算 BIP340 标签哈希，再对群阶取模得到 `e`。
        3. 用 64 个两位窗口计算 `sG − eP`。检查射影坐标 Z 非零，再比对偶数 nonce 点的两个坐标。
      - 付款封装校验公钥哈希，并把已验证的消息绑定到实际输入。发布版验签器使用坐标缩放、连续倍点和 secp256k1 GLV。[付款协议与曲线公式](docs/spec.zh-CN.md) · [Forth 付款源码](forth/schnorr.fth)
      - <a name="secp256k1-运算"></a>
      - 在 Script 中执行 secp256k1 点运算的合约可以复用这些曲线内核。[secp256k1 库](../../src/fourthgraph/stdlib/secp256k1.fth)
  reproduction:
    en:
      - |-
        ```sh
        PYTHONPATH="$PWD/tests" REGTEST_CHRONICLE_HEIGHT=5 \
          bash tools/verify_node.sh -- "$SCRIPT_LAB_SDK_PYTHON" -m unittest -v test_secp256k1_library
        bash tools/verify_node.sh -- bash sdk/verify_wallet.sh p2pkh-schnorr
        ```
      - The acceptance suite checks all 19 official BIP340 verification vectors through libsecp256k1 and
        both Script engines, and regenerates eight signing vectors with public test data. Payment cases
        cover all 12 paired BIP143 and Chronicle OTDA sighash modes in transaction versions 1 and 2. They
        cover stale locktime, ALL/NONE/SINGLE output commitments, malformed coordinates, ownership, fee
        balance, and Chronicle activation. The verifier tests exercise both lookup tables and infinity.
        The curve tests compare scaled point operations and GLV rounding with independent references and
        replay correct and incorrect results in both engines. [Payment tests](reference/test_schnorr.py)
        · [Curve tests](../../tests/test_secp256k1_library.py)
      - The compiler experiment has its own commands and pinned benchmark receipts.
        [Forth build and replay](docs/high-level-forth.en.md#replay)
    zh-CN:
      - |-
        ```sh
        PYTHONPATH="$PWD/tests" REGTEST_CHRONICLE_HEIGHT=5 \
          bash tools/verify_node.sh -- "$SCRIPT_LAB_SDK_PYTHON" -m unittest -v test_secp256k1_library
        bash tools/verify_node.sh -- bash sdk/verify_wallet.sh p2pkh-schnorr
        ```
      - 验收在 libsecp256k1 和两套脚本引擎上核对全部 19 条 BIP340 官方验签向量，并用公开测试数据复算 8 条签名向量。付款用例覆盖 BIP143 与 Chronicle
        OTDA 有同索引输出时的全部 12 种签名模式，使用交易版本 1 和 2。测试覆盖过时的锁定时间、ALL/NONE/SINGLE 的输出承诺、错误坐标、所有者校验、手续费平衡和 Chronicle
        激活。验签器测试覆盖两张查表及无穷远点。曲线测试用独立参考实现核对缩放点运算及 GLV 舍入，并在双引擎上复放正确和错误的结果。[付款测试](reference/test_schnorr.py)
        · [曲线测试](../../tests/test_secp256k1_library.py)
      - 编译实验提供单独的命令和固定的实测记录。[Forth 构建与复放](docs/high-level-forth.zh-CN.md#replay)
  script_sizes:
    en:
      - |-
        | Component | v0.16.0 | v0.17.0 |
        | --- | ---: | ---: |
        | Detached BIP340 verifier | 21,705 B | 21,625 B |
        | Complete payment lock | 22,515 B | 22,435 B |
      - The owner field starts at byte offset 189. The release record includes paired measurements on
        chain-gang and BSV Node for the detached verifier and both native P2PKH exit modes. The sCrypt
        report compares v0.6.0 with the legacy verifier and a separate BIP340 implementation using the
        same witness layout. [Layout and fingerprint](versions/v0.17.0/layout.json)
        · [Recorded measurements](versions/v0.17.0/measurements.json) · [sCrypt comparison](docs/scrypt-comparison.en.md)
    zh-CN:
      - |-
        | 组件 | v0.16.0 | v0.17.0 |
        | --- | ---: | ---: |
        | 独立 BIP340 验签器 | 21,705 B | 21,625 B |
        | 完整付款锁 | 22,515 B | 22,435 B |
      - 所有者槽位从字节偏移 189 开始。实测记录包含 chain-gang 与 BSV Node 对独立验签和两种原生 P2PKH 退出模式的交替测量。sCrypt 报告记录 v0.6.0 与旧版验签器的对照，以及同见证布局下与另一份 BIP340 实现的对照。[模板布局及指纹](versions/v0.17.0/layout.json)
        · [实测记录](versions/v0.17.0/measurements.json) · [sCrypt 对照](docs/scrypt-comparison.zh-CN.md)
  integration:
    en:
      - Use `createLock` with the x-only key or its HASH160. Verify the funding outpoint, amount and
        owner before approving the outputs and fee. Use `signPayment` for a single-input BIP143 ALL
        payment or `signInput` for a prepared transaction. The signer receives a 32-byte BIP340
        message and returns a 64-byte signature. [SDK quickstart](docs/sdk.en.md#quickstart)
      - <a name="build-from-forth"></a>
      - Load `REQUIRE stdlib/bip340.fth` for the detached verifier. The reference payment code adds
        ownership and transaction binding. [Forth source](forth/schnorr.fth) · [Version index](versions/index.json)
    zh-CN:
      - 用 x-only 公钥或其 HASH160 调用 `createLock`。批准输出和手续费前，核验入金 outpoint、金额和所有者。单输入 BIP143 ALL 付款用 `signPayment`，已组装交易用 `signInput`。签名器接收 32 字节 BIP340 消息并返回 64 字节签名。[SDK 快速上手](docs/sdk.zh-CN.md#quickstart)
      - <a name="从-forth-构建"></a>
      - 用 `REQUIRE stdlib/bip340.fth` 加载独立验签器。参考付款代码加入所有者校验和交易绑定。[Forth 源码](forth/schnorr.fth) · [版本目录](versions/index.json)
  transactions:
    en:
      - <a name="measured-sizes"></a>
      - The v0.17.0 literal fixtures spend two Schnorr outputs and create two Schnorr outputs. BSV Node 1.2.3
        and pinned chain-gang verify complete inputs with explicit prevouts. The development evaluator
        measures stack peaks for input zero. The main and alternate item peaks and combined payload peak
        are recorded independently. Transaction and payload sizes are in bytes. [Recorded measurements](versions/v0.17.0/measurements.json)
        · [Benchmark method](../../docs/benchmark.md)
      - |-
        | Mode | Inputs × outputs | Previous locks | Unlocks | New locks | Total | Main / alt items | Stack payload |
        | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
        | BIP143 ALL (`0x41`) | 2 × 2 | 22,435 × 2 | 329 × 2 | 22,435 × 2 | 45,646 | 90 / 13 | 3,401 |
        | Chronicle OTDA ALL (`0x61`) | 2 × 2 | 22,435 × 2 | 45,161 × 2 | 22,435 × 2 | 135,310 | 90 / 13 | 90,154 |
      - |-
        ```sh
        PYTHONPATH=src:. bash tools/verify_node.sh -- "$SCRIPT_LAB_SDK_PYTHON" -m fourthgraph.benchmark.run \
          --project p2pkh-schnorr --venvs-dir projects/p2pkh-schnorr/workspace --output projects/p2pkh-schnorr/workspace/build/benchmark
        ```
      - For the same v0.17.0 two-input, two-output OTDA ALL payment, the constructor reduces each unlock from
        45,161 to 4,819 bytes and the transaction from 135,310 to 54,626 bytes. The reconstructed
        payment was mined on default-policy regtest. [Constructor comparison](docs/high-level-forth.en.md#otda-constructor)
      - Under BSV Node 1.2.3's default regtest policy, funding, turnover, and exit entered the mempool
        and were mined in both modes.
      - |-
        ```sh
        PYTHONPATH=src:. bash tools/verify_node.sh --profile default -- "$SCRIPT_LAB_SDK_PYTHON" -m fourthgraph.benchmark.admission \
          p2pkh-schnorr --template v0.17.0 --turnover --output projects/p2pkh-schnorr/workspace/build/admission.json
        PYTHONPATH=src:. bash tools/verify_node.sh --profile default -- "$SCRIPT_LAB_SDK_PYTHON" -m fourthgraph.benchmark.admission \
          p2pkh-schnorr --template v0.17.0-reconstructed --turnover --output projects/p2pkh-schnorr/workspace/build/admission-reconstructed.json
        ```
    zh-CN:
      - <a name="交易实测"></a>
      - v0.17.0 原样编码夹具花费两个 Schnorr 输出，再创建两个 Schnorr 输出。BSV Node 1.2.3 和固定版本的 chain-gang 通过显式提供上一输出来验证完整输入。栈数据由开发求值器从第一个输入的成功路径取得。主栈项数、备用栈项数和两栈载荷分别取各自的峰值。交易和载荷以字节计。[实测记录](versions/v0.17.0/measurements.json)
        · [基准口径](../../docs/benchmark.zh-CN.md)
      - |-
        | 模式 | 输入 × 输出 | 上一输出锁定 | 解锁 | 新输出锁定 | 整笔 | 主栈 / 备用栈 | 两栈载荷 |
        | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
        | BIP143 ALL (`0x41`) | 2 × 2 | 22,435 × 2 | 329 × 2 | 22,435 × 2 | 45,646 | 90 / 13 | 3,401 |
        | Chronicle OTDA ALL (`0x61`) | 2 × 2 | 22,435 × 2 | 45,161 × 2 | 22,435 × 2 | 135,310 | 90 / 13 | 90,154 |
      - |-
        ```sh
        PYTHONPATH=src:. bash tools/verify_node.sh -- "$SCRIPT_LAB_SDK_PYTHON" -m fourthgraph.benchmark.run \
          --project p2pkh-schnorr --venvs-dir projects/p2pkh-schnorr/workspace --output projects/p2pkh-schnorr/workspace/build/benchmark
        ```
      - v0.17.0 的同一笔两进两出 OTDA ALL 付款，使用构造器后每个解锁脚本从 45,161 B 降到 4,819 B，整笔交易从 135,310 B 降到 54,626 B，并在默认 regtest 策略下出块。[构造器对照](docs/high-level-forth.zh-CN.md#otda-constructor)
      - 在 BSV Node 1.2.3 的默认 regtest 策略下，两种模式的入金、周转和退出均进入内存池并出块。
      - |-
        ```sh
        PYTHONPATH=src:. bash tools/verify_node.sh --profile default -- "$SCRIPT_LAB_SDK_PYTHON" -m fourthgraph.benchmark.admission \
          p2pkh-schnorr --template v0.17.0 --turnover --output projects/p2pkh-schnorr/workspace/build/admission.json
        PYTHONPATH=src:. bash tools/verify_node.sh --profile default -- "$SCRIPT_LAB_SDK_PYTHON" -m fourthgraph.benchmark.admission \
          p2pkh-schnorr --template v0.17.0-reconstructed --turnover --output projects/p2pkh-schnorr/workspace/build/admission-reconstructed.json
        ```
  lifecycle:
    en:
      - Each added-input or added-output cell gives the change from 2 × 2 in **total bytes (new output
        locks / input unlocks / other serialization)**. Previous locks are counted in the transaction
        that funds the UTXO. Both lifecycle totals include native P2PKH funding and exit. One turnover
        adds a payment between Schnorr outputs.
      - |-
        | Mode | Added-input shape | Added-input bytes | Added-output shape | Added-output bytes | Fund and exit | One turnover |
        | --- | ---: | ---: | ---: | ---: | ---: | ---: |
        | BIP143 ALL (`0x41`) | 3 × 2 | 372 (0 / 329 / 43) | 2 × 3 | 22,446 (22,435 / 0 / 11) | 45,872 | 91,518 |
        | Chronicle OTDA ALL (`0x61`) | 3 × 2 | 45,327 (0 / 45,284 / 43) | 2 × 3 | 67,346 (22,435 / 44,896 / 15) | 45,886 | 181,195 |
      - '[Unified benchmark and reproduction](../../docs/benchmark.md) · [Native 2-of-2 lifecycle comparison](docs/threshold-comparison.en.md)'
    zh-CN:
      - 每个边际单元格给出相对两进两出的**新增整笔字节（新输出锁定脚本 / 输入解锁脚本 / 其余序列化字节）**。上一输出的锁计入创建该 UTXO 的交易。两个生命周期总量都包括原生 P2PKH
        入金与退出，周转列在中间增加一次 Schnorr 输出之间的付款。
      - |-
        | 模式 | 加输入后 | 加输入成本 | 加输出后 | 加输出成本 | 入金与直接退出 | 含一次周转 |
        | --- | ---: | ---: | ---: | ---: | ---: | ---: |
        | BIP143 ALL (`0x41`) | 3 × 2 | 372 (0 / 329 / 43) | 2 × 3 | 22,446 (22,435 / 0 / 11) | 45,872 | 91,518 |
        | Chronicle OTDA ALL (`0x61`) | 3 × 2 | 45,327 (0 / 45,284 / 43) | 2 × 3 | 67,346 (22,435 / 44,896 / 15) | 45,886 | 181,195 |
      - '[统一测量入口与复现口径](../../docs/benchmark.zh-CN.md) · [原生 2-of-2 生命周期对照](docs/threshold-comparison.zh-CN.md)'
