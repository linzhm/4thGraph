$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: Winterfell SHA-256 STARK
  zh-CN: Winterfell SHA-256 STARK
summary:
  en: Build and verify a transparent STARK with SHA-256 commitments and a SHA-256 Fiat–Shamir transcript. Compile and replay the hash layer and a real Winterfell trace opening on BSV.
  zh-CN: 用 SHA-256 承诺和 SHA-256 Fiat–Shamir transcript 生成与验证透明 STARK，并在 BSV 编译与复放哈希原语和实际 Winterfell 轨迹开封。
entry_points:
  - name: fourthgraph-stark-sha256
    description:
      en: Prove and verify the public counter using the pinned Winterfell SHA-256 profile.
      zh-CN: 用固定的 Winterfell SHA-256 配置为公开计数器出证并验证。
  - name: hashes.fth
    description:
      en: Compile the tagged SHA-256 operations, including trace rows, ordered Merkle parents and transcript counters.
      zh-CN: 编译带标签的 SHA-256 操作，包括轨迹行、有序 Merkle 父节点及 transcript 计数器。
  - name: verify-trace-opening
    description:
      en: Compile the depth-13 trace-opening lock with the expected root fixed at build time.
      zh-CN: 编译深度为 13 层的轨迹开封锁，在构建时固定预期根。
setup:
  en:
    - Run from the repository root with Rust 1.87 or later and Python 3.11 or later. Cargo uses the checked-in lockfile.
  zh-CN:
    - 在仓库根目录运行，使用 Rust 1.87 或以上及 Python 3.11 或以上。Cargo 使用仓库中的 lockfile。
sections:
  algorithm:
    en:
      - Both proof profiles use the same counter AIR, public inputs and FRI parameters. This project's host verifier fixes SHA-256 at build time for both Winterfell Merkle commitments and its random coin. [Hash encoding and integration](docs/verification.en.md)
    zh-CN:
      - 两个证明配置共用计数器 AIR、公开输入和 FRI 参数。本项目在构建时为 Winterfell 的 Merkle 承诺和随机币固定 SHA-256。 [哈希编码与集成](docs/verification.zh-CN.md)
  reproduction:
    en:
      - Four public proofs and 16 proof rejection cases replay against the shared counter. The Rust tests exercise both directions of cross-profile rejection. BSV Node and chain-gang independently check all five compiled hash primitives. [Proof sizes](versions/v0.1.0/measurements.json) · [Native Script evidence](versions/v0.1.0/hash-checks.json)
      - v0.2.0 extracts trace queries and opens them against the actual proof commitments. A 368 B lock verifies each 13-level path. Both BSV engines accept the three openings and reject 27 mutations. [Opening replay](versions/v0.2.0/opening-checks.json)
      - The controlled comparison reduces the opening lock from 550 B to 368 B. [Method and reproduction](docs/verification.en.md#opening-lock-comparison) · [Versioned benchmark](versions/v0.2.0/opening-comparison.json)
    zh-CN:
      - 复放使用同一计数器，覆盖四份公开证明及 16 个证明拒绝用例。Rust 测试覆盖两个方向的跨配置拒绝。BSV Node 与 chain-gang 独立核对五个编译后的哈希原语。 [证明大小](versions/v0.1.0/measurements.json) · [原生 Script 实测](versions/v0.1.0/hash-checks.json)
      - v0.2.0 从实际证明提取轨迹查询及开封。368 B 的锁核验 13 层路径。BSV 双引擎接受三份开封，拒绝 27 个反例。 [开封复放](versions/v0.2.0/opening-checks.json)
      - 同一开封夹具对照中，锁脚本从 550 B 降至 368 B。 [测试方法与复现](docs/verification.zh-CN.md#开封锁对照) · [版本实测](versions/v0.2.0/opening-comparison.json)
