$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: Transaction workflow examples
  zh-CN: 交易工作流示例
summary:
  en: Compile Forth examples into Bitcoin Script and replay transaction plans with different dependencies.
  zh-CN: 将 Forth 示例编译成 Bitcoin Script，再复放具有不同依赖关系的交易计划。
entry_points:
  - name: 4thgraph --entry inc
    description:
      en: Compile the increment word and return the Script in the build report.
      zh-CN: 编译递增词，在构建报告中返回 Script。
setup:
  en:
    - Run the release commands from the repository root with Python 3.11 or later and the workflow test
      dependencies. [Gforth test environment](gforth/README.md)
    - |-
      ```sh
      python -m pip install ecdsa -r tools/requirements-chronicle.txt
      ```
  zh-CN:
    - 使用 Python 3.11 或更新版本及工作流测试依赖，从仓库根目录运行版本命令。[Gforth 测试环境](gforth/README.md)
    - |-
      ```sh
      python -m pip install ecdsa -r tools/requirements-chronicle.txt
      ```
sections:
  algorithm:
    en:
      - '**[Compile a word](#compile-a-word)** · [Build transaction plans](../../docs/toolchain.md#交易与验证)
        · [Gforth frontend](gforth/README.md)'
      - '[Parallel branches](example.fth), [a gated variant](gated.fth), [a fork/join graph](fork-join-graph.fth)
        and [a serial graph](serial-graph.fth) show different transaction dependencies. [Library composition](library-composition.fth)
        imports public Forth words. The [Gforth frontend](gforth/README.md) builds a transaction plan
        from Forth definitions.'
      - '[PELS settlement](pels-settle.fth) declares one input and two ordered outputs. Use the
        [Agent tuning loop](../../docs/README.md#agent-tuning-loop) to compare build choices and verify their results.'
    zh-CN:
      - '**[编译一个词](#compile-a-word)** · [构建交易计划](../../docs/toolchain.md#交易与验证) · [Gforth 前端](gforth/README.md)'
      - '[并行分支](example.fth)、[带前置条件的分支](gated.fth)、[分叉与汇合](fork-join-graph.fth)和[串行状态](serial-graph.fth)展示了不同的交易依赖。[标准库示例](library-composition.fth)展示如何导入公共词。'
      - '[PELS 结算示例](pels-settle.fth)约定一个输入和两个有序输出。用 [Agent 调优循环](../../docs/README.zh-CN.md#agent-tuning-loop)比较构建候选并验证结果。'
  reproduction:
    en:
      - '### Compile a word'
      - Run from the repository root with Python 3.11 or later.
      - The command emits the Script for `inc` as JSON. To compare complete transaction plans, use the
        same source with the test role keys and task ID from a replay. See the [build and replay guide](../../docs/toolchain.md#复放与编译).
    zh-CN:
      - <a name="compile-a-word"></a>
      - '### 编译一个词'
      - 使用 Python 3.11 或更新版本，从仓库根目录运行。
      - JSON 输出包含 `inc` 对应的 Script。用同一份源码比较完整交易计划时，从复放报告获取测试角色的公钥和任务 ID。[构建与复放教程](../../docs/toolchain.md#复放与编译)
