$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: Native P2PK and P2PKH baseline
  zh-CN: 原生 P2PK 与 P2PKH 基准
summary:
  en: Receive to P2PK or P2PKH, then sign a payment with your secp256k1 signer.
  zh-CN: 生成 P2PK 或 P2PKH 收款脚本，再用自己的 secp256k1 签名器完成付款。
entry_points:
  - name: p2pk-lock
    description:
      en: Build a lock from a 33-byte compressed secp256k1 public key.
      zh-CN: 用 33 字节压缩 secp256k1 公钥构造锁。
  - name: p2pkh-lock
    description:
      en: Build a lock from the recipient’s 20-byte public-key hash.
      zh-CN: 用收款方的 20 字节公钥哈希构造锁。
setup:
  en:
    - Run the release commands from the repository root with the pinned project dependencies.
    - |-
      ```sh
      python -m pip install -r projects/p2pk-p2pkh-baseline/reference/requirements.txt
      ```
  zh-CN:
    - 从仓库根目录使用项目固定的依赖运行版本命令。
    - |-
      ```sh
      python -m pip install -r projects/p2pk-p2pkh-baseline/reference/requirements.txt
      ```
sections:
  use_cases:
    en:
      - Start here when bringing up a transaction builder, a secp256k1 signing device, or a wallet migration.
        Check serialization with the public vector first. Then connect your own signer and use the same
        workflow to compare another signature scheme.
      - P2PKH is the usual choice when a payment request provides a public-key hash. The spending wallet
        reveals the full public key with the signature. P2PK is useful as a control when the payer already
        has the recipient's public key. For BIP143 ALL, P2PK moves 10 bytes into each receive output and
        saves about 34 bytes per spending input. Compare both sides if your wallet batches funding or
        consolidates many inputs. [Transaction costs](#complete-transactions-and-stack-measurements)
    zh-CN:
      - 接入交易构造器、secp256k1 签名设备或迁移钱包时，可以从这里建立基准。先用公开向量核对序列化，再换成自己的签名器。后续接入其他方案时，沿用同一套收款和付款流程比较差异。
      - 付款请求只提供公钥哈希时，可选择 P2PKH，花费时再提交完整公钥和签名。付款方已取得收款公钥时，可用 P2PK 做对照。在 BIP143 ALL 下，P2PK 每个输出多 10 字节，每个花费输入约少
        34 字节。批量出款和多输入归集时，应按输入与输出的实际数量比较。[交易成本](#完整交易与栈测量)
      - '### 输入输出取舍'
      - 在 BIP143 ALL 夹具中，P2PKH 每个输出锁比 P2PK 少 10 字节，每个解锁约多 34 字节，因为花费者需要携带公钥。两进两出样本分别为 374 和 326 字节，DER
        签名编码长度可随样本变化。数据可用于核对钱包的锁定和解锁格式，完整交易的基准判定使用 BSV Node 和 chain-gang。
  algorithm:
    en:
      - '[Protocol](docs/developer.en.md#protocol) · [Forth and compiled Script](#forth-source-and-compiled-script)
        · [Security](docs/developer.en.md#security) · [Verify](#run) · [Transaction costs](#complete-transactions-and-stack-measurements)'
      - Native P2PKH is the first wallet integration example and the transaction-cost baseline for 4thGraph.
        P2PK uses the same secp256k1 signer and provides a control for placing the public key in the output
        lock. Both templates have public fixtures that you can replay as you integrate another project.
      - '[Build locks from Forth](forth/README.md) · [Reproduce the benchmark](../../docs/benchmark.md)'
      - '### Forth source and compiled Script'
      - The Forth constructors check the recipient field width and assemble the locking scripts. Both
        examples use the public fixture key.
      - '#### P2PK'
      - The constructor takes a 33-byte compressed secp256k1 public key. The spending input supplies `<signature>`.
        [Example entry](forth/p2pk.fth) · [Standard library](../../src/fourthgraph/stdlib/p2pk.fth)
      - |-
        ```forth
        : p2pk-lock ( bytes -- bytes )
            33 bytes-check-size
            bytes-hex 21 swap bytes-cat bytes-hex ac bytes-cat ;

        : p2pk ( bytes -- bytes ) p2pk-lock ;
        ```
      - The 35-byte lock pushes the public key and executes `OP_CHECKSIG`.
      - |-
        ```text
        0x0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 OP_CHECKSIG
        ```
      - |-
        ```text
        210279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798ac
        ```
      - '#### P2PKH'
      - The constructor takes a 20-byte HASH160 of the public key. The spending input supplies `<signature>
        <public key>`. [Example entry](forth/p2pkh.fth) · [Standard library](../../src/fourthgraph/stdlib/p2pkh.fth)
      - |-
        ```forth
        : p2pkh-lock ( bytes -- bytes )
            20 bytes-check-size
            bytes-hex 76a914 swap bytes-cat bytes-hex 88ac bytes-cat ;

        : p2pkh ( bytes -- bytes ) p2pkh-lock ;
        ```
      - The 25-byte lock checks the supplied public key's hash before checking the signature.
      - |-
        ```text
        OP_DUP OP_HASH160 0x751e76e8199196d454941c45d1b3a323f1433bd6 OP_EQUALVERIFY OP_CHECKSIG
        ```
      - |-
        ```text
        76a914751e76e8199196d454941c45d1b3a323f1433bd688ac
        ```
      - '#### Optimization and reproduction'
      - In 4thGraph 0.2.7, `baseline`, `safe`, and `stack` emit identical bytecode for each constructor.
        Evaluating that bytecode with the fixture inputs produces the 35-byte P2PK and 25-byte P2PKH locks
        above, byte for byte against the existing `lock_hex` values. The wallet build evaluates the Forth
        constructors off-chain and uses the resulting bytes as the transaction output scripts. [Baseline
        fixtures](versions/v0.1.0/baseline.json)
      - From the repository root, print the locks and inspect the `stack` optimization reports for both
        constructors.
      - |-
        ```sh
        export PYTHONPATH=src:.
        forth=projects/p2pk-p2pkh-baseline/forth
        python3 "$forth/payments.py" --public-key 0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798
        python3 "$forth/payments.py" --hash160 751e76e8199196d454941c45d1b3a323f1433bd6

        for entry in p2pk p2pkh; do
          python3 -m fourthgraph.workflow.protocol "$forth/$entry.fth" --entry "$entry" --optimize stack
        done
        ```
      - '### Fixture contract'
      - |-
        | Template | Unlocking script | Expected verification |
        | --- | --- | --- |
        | P2PKH | Signature and full compressed pubkey | Correct pair passes; wrong signature fails at CHECKSIG; wrong public key fails at EQUALVERIFY |
        | P2PK | Signature only | Correct signature passes; wrong signature fails at CHECKSIG |
      - |-
        Fixture key scalars are public constants (1 and 2). Never use them to hold
        funds. The parent references a made-up outpoint; the spend is verified by
        supplying that parent directly to the library. Both use version 1 and the
        signer uses BIP143 ALL (`SIGHASH_ALL | SIGHASH_FORKID`, `0x41`). These tests exercise parent-aware script
        validation, not prior-outpoint existence, node policy, regtest mining, or
        mainnet. Do not broadcast these fixtures.
      - |-
        The offline generator and acceptance tests share the repository's Chronicle
        pin of the chain-gang Python binding. Projects using that exact pin can share
        the same environment. The Rust-backed binding supplies assembly, signing,
        and validation. [Shared dependency](../../tools/requirements-chronicle.txt)
      - |-
        To reproduce the original upstream control in its own environment, run
        `uv run --no-project --with 'tx-engine==0.13.1' python script_lab.py`.
        It reproduces the same checked-in baseline vector. [Upstream package](https://pypi.org/project/tx-engine/0.13.1/)
    zh-CN:
      - '[协议规范](docs/developer.zh-CN.md#protocol) · [Forth 源码与编译结果](#forth-源码与编译结果) · [安全分析](docs/developer.zh-CN.md#security)
        · [复现与验证](#复现与验收) · [交易成本](#完整交易与栈测量)'
      - 原生 P2PKH 是 4thGraph 的第一个钱包接入示例，也是对照其他签名方案的交易成本基准。P2PK 使用同一个 secp256k1 签名器，把公钥放在输出锁中，供对照输入和输出的成本。两种模板都有可复放的公开向量。
      - '[从 Forth 构建脚本](forth/README.md) · [复现基准](../../docs/benchmark.zh-CN.md)'
      - '### Forth 源码与编译结果'
      - Forth 构造词检查收款字段的长度，再拼接锁定脚本字节。两个示例都使用仓库公开夹具中的公钥。
      - '#### P2PK'
      - 构造词接收 33 字节压缩 secp256k1 公钥。解锁输入提供 `<signature>`。[示例入口](forth/p2pk.fth) · [标准库](../../src/fourthgraph/stdlib/p2pk.fth)
      - |-
        ```forth
        : p2pk-lock ( bytes -- bytes )
            33 bytes-check-size
            bytes-hex 21 swap bytes-cat bytes-hex ac bytes-cat ;

        : p2pk ( bytes -- bytes ) p2pk-lock ;
        ```
      - 锁定脚本共 35 字节，将公钥压栈后执行 `OP_CHECKSIG`。
      - |-
        ```text
        0x0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 OP_CHECKSIG
        ```
      - |-
        ```text
        210279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798ac
        ```
      - '#### P2PKH'
      - 构造词接收 20 字节公钥 HASH160。解锁输入提供 `<signature> <public key>`。[示例入口](forth/p2pkh.fth) · [标准库](../../src/fourthgraph/stdlib/p2pkh.fth)
      - |-
        ```forth
        : p2pkh-lock ( bytes -- bytes )
            20 bytes-check-size
            bytes-hex 76a914 swap bytes-cat bytes-hex 88ac bytes-cat ;

        : p2pkh ( bytes -- bytes ) p2pkh-lock ;
        ```
      - 锁定脚本共 25 字节，先核对公钥哈希，再验证签名。
      - |-
        ```text
        OP_DUP OP_HASH160 0x751e76e8199196d454941c45d1b3a323f1433bd6 OP_EQUALVERIFY OP_CHECKSIG
        ```
      - |-
        ```text
        76a914751e76e8199196d454941c45d1b3a323f1433bd688ac
        ```
      - '#### 优化与复现'
      - 在 4thGraph 0.2.7 中，每个构造词在 `baseline`、`safe` 和 `stack` 模式下都生成相同的字节码。传入夹具数据求值后，得到上面的 35 字节 P2PK
        和 25 字节 P2PKH 锁定脚本，与现有的 `lock_hex` 逐字节一致。钱包在链下执行 Forth 构造词，把得到的字节用作交易输出的锁定脚本。[基准夹具](versions/v0.1.0/baseline.json)
      - 从仓库根目录运行以下命令，打印两种锁定脚本并查看构造词的 `stack` 优化报告。
      - |-
        ```sh
        export PYTHONPATH=src:.
        forth=projects/p2pk-p2pkh-baseline/forth
        python3 "$forth/payments.py" --public-key 0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798
        python3 "$forth/payments.py" --hash160 751e76e8199196d454941c45d1b3a323f1433bd6

        for entry in p2pk p2pkh; do
          python3 -m fourthgraph.workflow.protocol "$forth/$entry.fth" --entry "$entry" --optimize stack
        done
        ```
  reproduction:
    en:
      - '### Run'
      - |-
        From `projects/p2pk-p2pkh-baseline/reference/`, with Python 3.12, a Rust
        toolchain and uv. [uv documentation](https://docs.astral.sh/uv/)
      - |-
        ```sh
        uv run --no-project --with-requirements requirements.txt python script_lab.py
        ```
      - |-
        The first run may download and build the pinned dependency. The script itself
        has no network operations. After provisioning, add `--offline` after `uv run`.
        It exits nonzero on a script encoding or validation mismatch and otherwise
        emits raw parent/spend transactions, ASM, script hex and per-case outcomes.
        `../versions/v0.1.0/baseline.json` is the checked-in output. To check reproducibility,
        pipe the same command into `cmp - ../versions/v0.1.0/baseline.json`.
      - '### Node cross-check'
      - |-
        The five checked-in fixtures were also passed to BSV Node 1.2.3
        `verifyscript` in isolated Apple Container regtest. The RPC used each raw
        spend at input 0 and its synthetic prevout's exact script, amount and height
        3, with Genesis at height 1 and Chronicle at height 2. The node agreed with
        the pinned offline engine on two accepts and three rejects. This checks
        script execution with an explicit prevout. Funded UTXO, mempool and block
        acceptance are separate milestones for issue #1.
      - |-
        The [native acceptance matrix](reference/acceptance.md) exhaustively covers
        2,880 complete-input combinations in its declared domain, including all
        12 paired BIP143 and Chronicle OTDA sighash combinations. It also checks
        80 unpaired SINGLE mutation cases and 192 cases around Chronicle activation.
        Explicit transaction commitments determine the expected result for each row.
    zh-CN:
      - '### 复现与验收'
      - 从 `projects/p2pk-p2pkh-baseline/reference/` 中使用 Python 3.12、Rust 工具链和 [uv](https://docs.astral.sh/uv/)。
      - |-
        ```sh
        uv run --no-project --with-requirements requirements.txt python script_lab.py
        ```
      - 脚本输出上笔交易、花费交易、Script 汇编、十六进制和用例结果。依赖已安装时，可以添加 `--offline`。通过 `cmp - ../versions/v0.1.0/baseline.json`
        与[固定输出](versions/v0.1.0/baseline.json)比较。样本用公开私钥和合成上一输出，只用于本地重放。
      - 离线示例使用版本 1 的交易和 BIP143 ALL。独立[验收矩阵](reference/acceptance.md)列出 2,880 种完整输入组合、80 个无配对 SINGLE 变更用例和
        192 个 Chronicle 激活边界用例。统一测量使用独立的版本 2 交易样本。
  integration:
    en:
      - |-
        A normal P2PK output carries a compressed public key and CHECKSIG. Its input
        supplies a signature and the selected sighash byte. P2PKH outputs carry a
        20-byte HASH160. That input supplies the signature and the public key whose
        hash matches the lock. Use these fixtures to validate an existing wallet's
        serialization and signature handling. Authenticate the funding outpoint,
        value and locking script before requesting a signature.
      - |-
        With the BIP143 ALL benchmark, moving from P2PK to P2PKH saves 10 bytes
        on each output lock and adds about 34 bytes to each input unlock. The
        whole-transaction cost therefore depends on the number of each. The
        complete-input tests use the modes and activation contexts in the
        [acceptance matrix](reference/acceptance.md). The offline example and the unified benchmarks use separate fixtures with the shared Chronicle pin.
    zh-CN:
      - 从钱包接入指南取得收款锁构造、签名请求和见证组装示例。链上验收结果见仓库的完整输入矩阵。[钱包 SDK](docs/sdk.zh-CN.md#quickstart) · [付款验收](reference/acceptance.md)
  transactions:
    en:
      - These deterministic fixtures use commit `beeb4dd`. BSV Node 1.2.3 and the project's pinned chain-gang
        validate the complete inputs. The node replays scripts with supplied prevouts. Funded mempool
        and mining tests have separate records. Scripts and transactions are measured in bytes. Script
        sizes follow input and output order. `× n` indicates n equal sizes. Stack peaks refer to input
        zero, with independent peaks for main-stack items, altstack items, and combined payload. The development
        evaluator measures stack payload bytes on the successful path.
      - |-
        | Template and mode | Inputs×outputs | Previous locks | Unlocks | New locks | Total | Main / alt items | Stack payload |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | `p2pk` · `0x41` | 2×2 | 35 × 2 | 73 × 2 | 35 × 2 | 326 | 2 / 0 | 105 |
        | `p2pk` · `0x61` | 2×2 | 35 × 2 | 72 / 73 | 35 × 2 | 325 | 2 / 0 | 104 |
        | `p2pkh` · `0x41` | 2×2 | 25 × 2 | 107 × 2 | 25 × 2 | 374 | 4 / 0 | 145 |
        | `p2pkh` · `0x61` | 2×2 | 25 × 2 | 107 × 2 | 25 × 2 | 374 | 4 / 0 | 145 |
    zh-CN:
      - 下表取自提交 `beeb4dd` 的确定性交易夹具，所有完整输入由 BSV Node 1.2.3 和项目固定的 chain-gang 版本验证。节点通过显式提供上一输出执行脚本，默认策略下的入内存池及出块另有复放记录。脚本和交易以字节计。表中按索引列出每个输入或输出的大小，`×
        n` 表示同样大小重复 n 次。栈数据取第一个输入的成功路径。主栈项数、备用栈项数和两栈载荷分别记录各自达到的峰值，单位为项或字节。栈开销由开发求值器估计，统计栈上数据的字节数。
      - |-
        | 模板与模式 | 输入×输出 | 上一输出锁定 | 解锁 | 新输出锁定 | 整笔 | 主栈 / 备用栈 | 两栈载荷 |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | `p2pk` · `0x41` | 2×2 | 35 × 2 | 73 × 2 | 35 × 2 | 326 | 2 / 0 | 105 |
        | `p2pk` · `0x61` | 2×2 | 35 × 2 | 72 / 73 | 35 × 2 | 325 | 2 / 0 | 104 |
        | `p2pkh` · `0x41` | 2×2 | 25 × 2 | 107 × 2 | 25 × 2 | 374 | 4 / 0 | 145 |
        | `p2pkh` · `0x61` | 2×2 | 25 × 2 | 107 × 2 | 25 × 2 | 374 | 4 / 0 | 145 |
  lifecycle:
    en:
      - Each marginal cell shows the **change in total bytes (output locks / input unlocks / other bytes)**.
        Other bytes include values, outpoints, sequence numbers, and CompactSize fields. Previous locks
        identify the coins being spent and belong to their funding transactions. Both lifecycle totals
        include native P2PKH funding and exit. The second adds one payment between project outputs.
      - |-
        | Template and mode | Added-input shape | Added-input bytes | Added-output shape | Added-output bytes | Fund and exit | One turnover |
        | --- | --- | --- | --- | --- | --- | --- |
        | `p2pk` · `0x41` | 3×2 | 113 (0 / 72 / 41) | 2×3 | 43 (35 / -1 / 9) | 550 | 877 |
        | `p2pk` · `0x61` | 3×2 | 113 (0 / 72 / 41) | 2×3 | 45 (35 / 1 / 9) | 549 | 875 |
        | `p2pkh` · `0x41` | 3×2 | 146 (0 / 105 / 41) | 2×3 | 34 (25 / 0 / 9) | 598 | 972 |
        | `p2pkh` · `0x61` | 3×2 | 146 (0 / 105 / 41) | 2×3 | 33 (25 / -1 / 9) | 599 | 970 |
      - '[Unified benchmark and reproduction](../../docs/benchmark.md)'
      - '[Compile the Forth locking scripts](forth/README.md).'
    zh-CN:
      - 每个边际单元格为 **新增整笔字节（输出锁定脚本 / 输入解锁脚本 / 其余序列化字节）**。其余字节包括金额、outpoint、序列号和 CompactSize 等字段。上一输出脚本列用于说明被花费的锁，该脚本长度属于此前创建
        UTXO 的交易。生命周期从原生 P2PKH 入金开始，以原生 P2PKH 退出，周转列在两者之间增加一次项目内转付。
      - |-
        | 模板与模式 | 加输入后 | 加输入成本 | 加输出后 | 加输出成本 | 入金与直接退出 | 含一次周转 |
        | --- | --- | --- | --- | --- | --- | --- |
        | `p2pk` · `0x41` | 3×2 | 113 (0 / 72 / 41) | 2×3 | 43 (35 / -1 / 9) | 550 | 877 |
        | `p2pk` · `0x61` | 3×2 | 113 (0 / 72 / 41) | 2×3 | 45 (35 / 1 / 9) | 549 | 875 |
        | `p2pkh` · `0x41` | 3×2 | 146 (0 / 105 / 41) | 2×3 | 34 (25 / 0 / 9) | 598 | 972 |
        | `p2pkh` · `0x61` | 3×2 | 146 (0 / 105 / 41) | 2×3 | 33 (25 / -1 / 9) | 599 | 970 |
      - '[统一测量入口与复现口径](../../docs/benchmark.zh-CN.md)'
      - '[Compile the Forth locking scripts](forth/README.md).'
