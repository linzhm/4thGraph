$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: Goldilocks + SHA-256 FRI STARK verifier
  zh-CN: Goldilocks + SHA-256 FRI STARK 验证器
summary:
  en: Verify a 16-row Fibonacci AIR over Goldilocks and its quadratic extension using a BSV Script lock.
  zh-CN: 生成 BSV Script 锁，在 Goldilocks 基域及其二次扩域上验证固定的 16 行 Fibonacci AIR。
entry_points:
  - name: stark-lock
    description:
      en: Compile the generated Forth source to a BSV Script lock. [Generated verifier](versions/v0.2.0/verifier.fth)
      zh-CN: 将生成的 Forth 源码编译为 BSV Script 锁。 [生成的验证器](versions/v0.2.0/verifier.fth)
  - name: reference/verify.py
    description:
      en: Generate Forth, build a lock and witness, compare lowering plans, or replay recorded cases.
      zh-CN: 生成 Forth，构建锁和见证，对比编译方案，或复放固定用例。
setup:
  en:
    - From the repository root, use Python 3.11 or later. The regtest command requires the pinned chain-gang binding and `ecdsa`.
    - '`python -m pip install ecdsa -r tools/requirements-chronicle.txt`'
  zh-CN:
    - 从仓库根目录使用 Python 3.11 或更新版本。regtest 回放另需固定版本的 chain-gang 绑定和 `ecdsa`。
    - '`python -m pip install ecdsa -r tools/requirements-chronicle.txt`'
sections:
  algorithm:
    en:
      - The verifier decodes unsigned 64-bit coefficients with modulus `2^64 - 2^32 + 1`. The lock derives challenges, authenticates all Merkle openings, and checks 64 binary FRI folding paths and the AIR quotient. [Profile and packet layout](docs/spec.en.md)
      - The Goldilocks project uses the common Plonky3 0.5.3 prover and Script backend. Its quadratic extension, canonical encoding and transcript domain are specific to Goldilocks. [Native prover](../plonky3-stark-verifier/reference/prover/src/main.rs)
    zh-CN:
      - 验证器按模数 `2^64 - 2^32 + 1` 检查无符号 64 位系数。锁推导挑战值，认证所有 Merkle 开口，检查 64 条二元 FRI 折叠路径及 AIR 商等式。 [参数与字节布局](docs/spec.zh-CN.md)
      - 此项目复用 Plonky3 0.5.3 证明器和 Script 后端。二次扩域、规范编码及 transcript 域标签采用 Goldilocks 专属配置。 [原生证明器](../plonky3-stark-verifier/reference/prover/src/main.rs)
  reproduction:
    en:
      - Run `PYTHONPATH=src:. python projects/goldilocks-stark-verifier/reference/verify.py check` for the local Script fixtures. Funded replay mined the valid spend and rejected 12 controls, including a different AIR with the same public statement. [Regtest receipt](versions/v0.2.0/replay.json)
    zh-CN:
      - 运行 `PYTHONPATH=src:. python projects/goldilocks-stark-verifier/reference/verify.py check` 检查本地 Script 夹具。入金回放确认有效花费入块，另有 12 个负例被拒绝，其中包括公开声明相同、AIR 不同的证明。 [Regtest 回执](versions/v0.2.0/replay.json)
  integration:
    en:
      - |-
        `generate` writes a complete `verifier.fth` from the public inputs in Python. Compile it independently with `4thgraph script-build`. Use `compare` to replay all four compiler plans with the same witness. [Forth build and compiler options](docs/spec.en.md#generate-and-compile-forth)
    zh-CN:
      - 用 Python 的 `generate` 根据公开输入输出完整 `verifier.fth`，可独立交给 `4thgraph script-build` 编译。`compare` 用同一见证复放四种编译方案。 [Forth 构建与编译选项](docs/spec.zh-CN.md#生成与编译-forth)
  script_sizes:
    en:
      - For the public statement `(0, 1, 987)`, the lock is **137,656 B** and the unlock is **73,013 B**. The exported proof alone is 71,984 B. [Replay measurements](versions/v0.2.0/replay.json) · [Lock](versions/v0.2.0/lock.bin) · [Unlock](versions/v0.1.0/unlock.bin)
    zh-CN:
      - 公开声明为 `(0, 1, 987)` 时，锁定脚本为 **137,656 B**，解锁脚本为 **73,013 B**，原生导出的证明为 71,984 B。 [复放实测](versions/v0.2.0/replay.json) · [锁定脚本](versions/v0.2.0/lock.bin) · [解锁脚本](versions/v0.1.0/unlock.bin)
