$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: BN254 Groth16 verifier
  zh-CN: BN254 Groth16 验证器
summary:
  en: Assemble an owner-authorized, fixed-statement BN254 Groth16 lock from typed Forth and replay it on Chronicle regtest.
  zh-CN: 用带类型的 Forth 组装需要所有者签名的 BN254 Groth16 固定声明锁，并在 Chronicle regtest 回放。
entry_points:
  - name: verify-bn254-proof
    description:
      en: Construct the authorization and fold the five deployment-selected public inputs into the MSM before emitting the Rúnar predicate.
      zh-CN: 构造授权，把部署时选定的五个公开输入折叠进 MSM，再生成 Rúnar 验证谓词。
setup:
  en:
    - Run from the repository root with Python 3.11 or later, Go 1.26.6, and the pinned Rúnar checkout at `workspace/runar`. Funded replay also needs the Chronicle chain-gang binding and BSV Node.
    - |-
      ```sh
      git clone https://github.com/icellan/runar.git workspace/runar
      git -C workspace/runar checkout --detach dbcc4269f8e0895c4738cf86948b05b7d62a2010
      python3 -m pip install ecdsa -r tools/requirements-chronicle.txt
      ```
  zh-CN:
    - 从仓库根目录运行，使用 Python 3.11 或更新版本、Go 1.26.6 和检出到 `workspace/runar` 的固定 Rúnar 版本。入金回放还需 Chronicle chain-gang 绑定与 BSV Node。
    - |-
      ```sh
      git clone https://github.com/icellan/runar.git workspace/runar
      git -C workspace/runar checkout --detach dbcc4269f8e0895c4738cf86948b05b7d62a2010
      python3 -m pip install ecdsa -r tools/requirements-chronicle.txt
      ```
sections:
  algorithm:
    en:
      - The Forth entry combines owner authorization, the fixed statement, and the pairing predicate. Precomputing the statement MSM reduces the locking script from 1,524,095 B to 821,788 B. [Forth entry](forth/fixed-verifier.fth) · [Statement module](forth/statement.fth) · [Verification and sCrypt comparison](docs/verification.en.md)
    zh-CN:
      - Forth 入口组合所有者授权、固定声明和配对谓词。预计算声明的 MSM 后，锁定脚本从 1,524,095 B 降到 821,788 B。[Forth 入口](forth/fixed-verifier.fth) · [声明模块](forth/statement.fth) · [验证与 sCrypt 对照](docs/verification.zh-CN.md)
  reproduction:
    en:
      - The build uses a checked-in test-only fixture and writes the lock and witness prefix. The funded replay tests the valid statement and four rejection controls with BSV Node and chain-gang. [Measurements](versions/v0.2.0/measurements.json)
    zh-CN:
      - 构建使用仓库内的测试夹具，输出验证锁和见证前缀。入金回放在 BSV Node 和 chain-gang 上检查有效声明及四个拒绝用例。[实测](versions/v0.2.0/measurements.json)
