$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: BN254 Groth16 verifier
  zh-CN: BN254 Groth16 验证器
summary:
  en: Assemble an owner-authorized, fixed-statement BN254 Groth16 lock from typed Forth and replay it on Chronicle regtest.
  zh-CN: 用带类型的 Forth 组装需要所有者签名的 BN254 Groth16 固定声明锁，并在 Chronicle regtest 回放。
entry_points:
  - name: verify-bn254-proof
    description:
      en: Build the owner guard and specialize the pairing and G2 subgroup check for the fixed statement.
      zh-CN: 构造所有者授权，并对固定声明生成配对及 G2 子群检查。
setup:
  en:
    - Run from the repository root with Python 3.11 or later, Go 1.26.6, and the pinned Rúnar checkout at `workspace/runar`. Funded replay also needs the Chronicle chain-gang binding and BSV Node.
    - |-
      ```sh
      git clone https://github.com/icellan/runar.git workspace/runar
      git -C workspace/runar checkout --detach dbcc4269f8e0895c4738cf86948b05b7d62a2010
      python3 -m pip install ecdsa -r tools/requirements-chronicle.txt
      ```
  zh-CN:
    - 从仓库根目录运行，使用 Python 3.11 或更新版本、Go 1.26.6 和检出到 `workspace/runar` 的固定 Rúnar 版本。入金回放还需 Chronicle chain-gang 绑定与 BSV Node。
    - |-
      ```sh
      git clone https://github.com/icellan/runar.git workspace/runar
      git -C workspace/runar checkout --detach dbcc4269f8e0895c4738cf86948b05b7d62a2010
      python3 -m pip install ecdsa -r tools/requirements-chronicle.txt
      ```
sections:
  algorithm:
    en:
      - The compiler folds the fixed pairings and uses a projective G2 subgroup check. On the wrap fixture, the lock is 539,934 B and the proof witness prefix is 6,765 B. [Forth entry](forth/compact-verifier.fth) · [Statement module](forth/statement.fth) · [Verification and plan comparison](docs/verification.en.md)
    zh-CN:
      - 编译器预计算固定配对，并生成投影坐标的 G2 子群检查。`wrap` 夹具的锁定脚本为 539,934 B，见证前缀为 6,765 B。[Forth 入口](forth/compact-verifier.fth) · [声明模块](forth/statement.fth) · [验证与方案对比](docs/verification.zh-CN.md)
  reproduction:
    en:
      - The build writes the lock and proof witness prefix. The funded replay checks a valid proof and five rejection controls, including a G2 point outside the subgroup. [Measurements](versions/v0.3.0/measurements.json)
    zh-CN:
      - 构建输出锁定脚本和见证前缀。入金回放检查有效证明及五个拒绝用例，包括不在子群内的 G2 点。[实测](versions/v0.3.0/measurements.json)
