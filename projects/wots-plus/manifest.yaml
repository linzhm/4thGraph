      - '钱包 SDK 用 `template: "compact-v11"` 选择 v0.12.0 的付款锁。各版清单记录了 SDK 模板、Git 标签和源码提交。[接入示例](docs/sdk.zh-CN.md#quickstart)'
      - '### 缓存步骤模板实测'
      - 缓存步骤把每个锁从 42,266 降到 33,956 字节，降低入金及新建输出的成本。OTDA ALL 的重建再把同类两进两出从 208,406 降到 79,090 字节。配对 SINGLE 从 140,473
        降到 78,921 字节，而重建前后的两栈载荷峰值都是 70,280 字节。新增第三个输入与前两个输出无配对，边际仍是 2,440 字节。
  integration:
    en:
      - |-
        Authenticate the chosen funding outpoint and match its transaction-bound
        script against the selected key and layout. Arrange the recipients, change
        and fee before using `sign_payment` for a single input or `sign_spend` for a
        prepared input. The signer receives a 32-byte digest and returns one
        2,144-byte signature. Keep the one-time reservation durable before the
        callback returns a signature. Generate a fresh key for every output,
        including change. [Payment implementation](reference/payment.py)
      - |-
        The output cache reduces the bytes paid at funding and at every same-template
        output. OTDA output reconstruction reduces repeated copies in the input.
        In the paired SINGLE fixture, the two-stack payload peak is 70,280 bytes with
        either witness encoding, even as the signed transaction falls from 140,473
        to 78,921 bytes.
    zh-CN:
      - 钱包确认 outpoint、锁定格式、金额和所需确认，再安排收款、找零和费用。单输入付款调用 `sign_payment`，已构造交易逐输入调用 `sign_spend`。外部签名器接收
        32 字节摘要，返回 2,144 字节原始签名。每个 UTXO 都使用新密钥，必须先持久化消耗记录再返回签名。未广播或确认失败也要保留该记录。 [付款接口](reference/payment.py)
        · [已签名向量](versions/v0.1.0/vectors.json)
  transactions:
    en:
      - These deterministic fixtures use commit `beeb4dd`. BSV Node 1.2.3 and the project's pinned chain-gang
        validate the complete inputs. The node replays scripts with supplied prevouts. Funded mempool
        and mining tests have separate records. Scripts and transactions are measured in bytes. Script
        sizes follow input and output order. `× n` indicates n equal sizes. Stack peaks refer to input
        zero, with independent peaks for main-stack items, altstack items, and combined payload. The development
        evaluator measures stack payload bytes on the successful path.
