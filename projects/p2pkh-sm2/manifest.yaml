        | OTDA ALL, 2×2 transaction with reconstruction | 275,608 | 267,692 | −2.9% |
        | OTDA ALL, unlocking script per input in that transaction | 12,127 | 11,938 | −1.6% |
      - 'Select template `4` for a new output with `--version 4` or SDK `template: "v1.4.0"`. An OTDA
        ALL preimage can contain reconstructed outputs of all four templates. [Template fingerprint](versions/v1.4.0/layout.json)
        · [Recorded measurements](versions/v1.4.0/measurements.json)'
      - <a name="v130"></a>
      - '### v1.3.0'
      - The point-addition and doubling routines use one `OP_MOD` per coordinate and retain signed residues
        modulo the SM2 field prime. The verifier rejects a zero projective Z coordinate, then makes X
        and Z nonnegative before checking the two possible field x coordinates of the signature. This
        saves 5,949 bytes per output. The same OTDA ALL preimage can contain reconstructed outputs of
        all three templates.
