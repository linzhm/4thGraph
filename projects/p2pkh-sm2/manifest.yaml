      - '### v1.5.0'
      - The Forth formula compiler schedules the same homogeneous point arithmetic over the SM2 field.
        The compiled point addition is 123 bytes and doubling is 74 bytes, down from 176 and 89. The generator
        uses the frozen kernels at build time. Their compiler test compares the exact signed coordinates
        produced by the previous kernels, including infinity, equal points, inverse points and negative
        representatives.
