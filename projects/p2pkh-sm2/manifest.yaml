        ALL preimage can contain reconstructed outputs of all five templates. [Point formulas and reproduction](reference/README.md#point-kernels)
        · [Template fingerprint](versions/v1.5.0/layout.json) · [Recorded measurements](versions/v1.5.0/measurements.json)'
      - <a name="v140"></a>
      - '### v1.4.0'
      - The SM3 emitter stores expanded message words and selected round state words as five-byte little-endian
        values. The high byte is zero. Bitwise operations reuse those bytes directly, while arithmetic
        reads use `OP_BIN2NUM`. Reversing each four-byte word by halves also shortens data loading and
        digest output. Both SM3 programs together save 3,769 bytes per lock.
