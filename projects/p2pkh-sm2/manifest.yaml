$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: P2PKH-SM2
  zh-CN: P2PKH-SM2
summary:
  en: Choose a raw SM2 or SignedData signer. The wallet automatically selects a shorter OTDA unlocking
    script for eligible payments.
  zh-CN: 选择原始 SM2 签名器或 SignedData 签名器。符合条件的付款会自动选择更短的 OTDA 解锁编码。
entry_points:
  - name: locking_script_from_public_key
    description:
      en: Build a payment lock from the uncompressed SM2 public key.
      zh-CN: 用未压缩 SM2 公钥构造付款锁。
  - name: sign_input
    description:
      en: Request and verify an external signature for a selected input and sighash mode.
      zh-CN: 按所选输入和签名模式请求并验证外部签名。
setup:
  en:
    - Run the release commands from the repository root with Python 3.12, Rust, and OpenSSL with SM2 and
      SM3 support.
    - |-
      ```sh
      export PYTHONPATH=src:.
      python -m pip install -r projects/p2pkh-sm2/reference/requirements.txt
      ```
  zh-CN:
    - 在仓库根目录使用 Python 3.12、Rust 和支持 SM2、SM3 的 OpenSSL 运行版本命令。
    - |-
      ```sh
      export PYTHONPATH=src:.
      python -m pip install -r projects/p2pkh-sm2/reference/requirements.txt
      ```
sections:
  use_cases:
    en:
      - Evaluate P2PKH-SM2 when a wallet already uses an SM2 signing service. A provider that exposes
        a raw SM2 API returns the signature directly. A GB/T 35275-2026 provider can return a direct single-signer
        SignedData envelope under the wallet's trusted signer configuration. The SDK checks that off-chain
        envelope and writes the extracted 64-byte signature into the transaction. Track which provider
        operation the wallet uses and validate the exact message and user ID at integration time. [Signing
        contract](docs/sdk.en.md)
      - For payments that create other SM2 outputs, compare BIP143 and OTDA using the same input and output
        counts. On eligible Chronicle spends, the wallet shortens the OTDA unlock by reconstructing the
        signed preimage. Each new output also carries the full lock for its selected template. [Reconstruction
        measurements](#otda-constructor)
    zh-CN:
      - 已有 SM2 签名服务的钱包可以评估 P2PKH-SM2。提供原始 SM2 接口的服务直接返回签名。使用 GB/T 35275‑2026 服务时，可按钱包的可信签名者配置处理单签名者的直接签名
        SignedData 封装。SDK 在链下核验封装，将提取出的 64 字节签名写入交易。接入时应明确调用服务的哪个签名接口，并核对消息和用户标识。[签名接口](docs/sdk.zh-CN.md)
      - 如果付款会新建 SM2 输出，用相同的输入输出数量比较 BIP143 和 OTDA。钱包会为符合条件的 Chronicle 花费重建签名预映像，缩短 OTDA 解锁脚本。每个新输出携带所选模板的完整锁定脚本。[重建实测](#otda-constructor)
  algorithm:
    en:
      - '[v1.11.0 candidate](#v1110)'
      - '[Protocol](docs/spec.en.md) · [Security](docs/developer.en.md#security) · [Verify](#developer-checks-and-cost-analysis)
        · [Transaction costs](#complete-transactions-and-stack-measurements)'
      - |-
        P2PKH-SM2 lets a payer lock a BSV output to the HASH160 of the recipient’s
        uncompressed SM2 public key. To spend the output, the recipient reveals the
        public key and supplies one SM2 signature for the current input. Bitcoin Script
        uses SM3 to compute the SM2 identity digest ZA and the message digest. It
        verifies the SM2 signature and binds the authorization to the spending
        transaction through PUSHTX and native `OP_CHECKSIG`.
      - '### Project version and locking template'
      - Version 1.1.0 enables OTDA reconstruction by default for locking template `1` from the first public
        release, v1.0.0. Versions 1.2.0 through 1.7.0 correspond to templates `2` through `7`. Versions
        1.9.0 through 1.11.0 add templates `8` through `10`. The wallet recognizes and spends all ten templates
        from the previous output's exact bytes.
      - |-
        | Property | Value |
        | --- | --- |
        | Recipient identifier | HASH160 of the 65-byte public key `04 \|\| X_BE32 \|\| Y_BE32` |
        | SM2 user ID | The fixed ASCII value `1234567812345678` |
        | Locking script | 144,925 bytes for template `1`, 131,565 for `2`, 125,616 for `3`, 121,847 for `4`, 110,747 for `5`, 100,663 for `6`, 98,362 for `7`, 96,616 for `8`, 95,790 for `9`, and 94,355 for `10` |
        | Unlocking script | 291 bytes with BIP143, 294 bytes with unpaired OTDA SINGLE, and transaction-dependent for other OTDA modes |
        | Unlocking stack | Signing preimage, uncompressed public key, and 64-byte `r \|\| s` signature |
        | Signature modes | BIP143 and Chronicle OTDA, each with ALL, NONE, or SINGLE and optional ANYONECANPAY |
      - |-
        The current source includes the [layout manifest](versions/v1.0.0/layout.json),
        [standard SM2 vector](versions/v1.0.0/sm2-standard.json),
        [complete payment vector](versions/v1.0.0/spend-all.json), and
        [16 signing preimages](versions/v1.0.0/sighash-modes.json). [v1.0.0 release](https://github.com/linzhm/bsv-script-lab/releases/tag/p2pkh-sm2-v1.0.0)
      - <a name="otda-constructor"></a>
      - '### Reconstruct OTDA outputs'
      - The constructor is part of `scriptSig`. It uses 12,703 bytes for template `1`, 11,816 for `2`,
        11,807 for `3`, 11,618 for `4`, 11,549 for `5`, 9,363 for `6`, 9,447 for `7`, 7,644 for `8`, 7,718 for `9`, and
        7,754 for `10`. Templates `2` through `10` select reusable fragments from the initial encoding and
        place frequently used fragments near the top of the stack. The constructor reconstructs the exact
        signing preimage and fills each eligible output's HASH160 slot. The signing callback receives
        the same message and SM2 user ID as the literal encoding. Use the final signed transaction ID
        to build a child.
      - After Chronicle activation, version-2 OTDA ALL can reconstruct matching outputs in their original
        order. Paired OTDA SINGLE can reconstruct the same-index output and preserve the preceding null
        outputs in the preimage. Both support `ANYONECANPAY`. Other output templates keep their literal
        bytes. BIP143, NONE, unpaired SINGLE, version 1 and non-smaller encodings continue with the literal
        unlocking script. [SDK options](docs/sdk.en.md) · [Constructor and generator](reference/README.md#otda-constructor)
      - |-
        | OTDA ALL, bytes | Literal | Reconstructed |
        | --- | ---: | ---: |
        | Two inputs and two outputs | 870,194 | 316,018 |
        | First input's unlocking script | 290,109 | 13,023 |
        | Add one input | 290,277 | 13,189 |
        | Add one output | 434,814 | 145,022 |
        | Fund and exit | 290,794 | 290,794 |
        | Fund, turn over once, and exit | 1,160,988 | 606,812 |
      - Both encodings use the same fixture keys and amounts and pass BSV Node 1.2.3 and the pinned chain-gang
        build. The table uses benchmark profile `v1.1.0` for template `1` with automatic reconstruction
        and `v1.0.0` for the literal encoding.
    zh-CN:
      - '[v1.11.0 候选版](#v1110)'
      - '[协议规范](docs/spec.zh-CN.md) · [安全分析](docs/developer.zh-CN.md#security) · [复现与验证](#开发复现与输入输出分析)
        · [交易成本](#完整交易与栈测量)'
      - |-
        付款方可以用收款人未压缩 SM2 公钥的 HASH160 锁定一笔 BSV 输出。花费时，
        持有人公开该公钥，并为当前输入提供一次 SM2 签名。Bitcoin Script 使用 SM3 计算 SM2
        用户标识摘要 ZA 和消息摘要，然后验证 SM2 签名，并通过 PUSHTX 和原生
        `OP_CHECKSIG` 将授权绑定到实际的花费交易。
      - '### 项目版本与锁定模板'
      - v1.1.0 为首个公开版本 v1.0.0 的锁定模板 `1` 默认启用 OTDA 重建。v1.2.0 至 v1.7.0 依次对应模板 `2` 至 `7`。v1.9.0 至 v1.11.0 依次增加模板 `8` 至 `10`。钱包按上一输出的完整字节识别并花费十种模板。
      - |-
        | 项目 | 取值 |
        | --- | --- |
        | 收款标识 | 65 字节公钥 `04 \|\| X_BE32 \|\| Y_BE32` 的 HASH160 |
        | SM2 用户标识 | 固定的 ASCII 字符串 `1234567812345678` |
        | 锁定脚本 | 模板 `1` 为 144,925 字节，`2` 为 131,565 字节，`3` 为 125,616 字节，`4` 为 121,847 字节，`5` 为 110,747 字节，`6` 为 100,663 字节，`7` 为 98,362 字节，`8` 为 96,616 字节，`9` 为 95,790 字节，`10` 为 94,355 字节 |
        | 解锁脚本 | BIP143 为 291 字节，无配对输出的 OTDA SINGLE 为 294 字节，其他 OTDA 模式的长度随交易变化 |
        | 解锁栈 | 签名预映像、未压缩公钥，以及 64 字节的 `r \|\| s` 签名 |
        | 交易签名模式 | BIP143 和 Chronicle OTDA 均支持 ALL、NONE、SINGLE，每种模式均可选用 ANYONECANPAY |
      - |-
        当前源码包含[模板布局](versions/v1.0.0/layout.json)、[SM2 标准向量](versions/v1.0.0/sm2-standard.json)、
        [完整付款向量](versions/v1.0.0/spend-all.json)和 [16 个签名预映像](versions/v1.0.0/sighash-modes.json)。[v1.0.0 发布页](https://github.com/linzhm/bsv-script-lab/releases/tag/p2pkh-sm2-v1.0.0)
      - <a name="otda-constructor"></a>
      - '### 重建 OTDA 输出'
      - 构造器是 `scriptSig` 的一部分，模板 `1` 使用 12,703 字节，`2` 使用 11,816 字节，`3` 使用 11,807 字节，`4` 使用 11,618 字节，`5`
        使用 11,549 字节，`6` 使用 9,363 字节，`7` 使用 9,447 字节，`8` 使用 7,644 字节，`9` 使用 7,718 字节，`10` 使用 7,754 字节。模板 `2` 至 `10` 从初始编码实际复制的指令中选出可复用片段，并把高频片段放在靠近栈顶的位置。构造器逐字节重建签名预映像，把收款人的
        HASH160 填入各个适用输出。签名回调接收与原样编码一致的消息和 SM2 用户标识。构建子交易时使用最终已签交易的 ID。
      - Chronicle 激活后，版本 2 的 OTDA ALL 交易可以按原顺序重建匹配的输出。配对 OTDA SINGLE 可以重建同索引输出，并保留预映像中前置的空输出。两种模式均支持 `ANYONECANPAY`。其他模板的输出按原字节写入。BIP143、NONE、无配对
        SINGLE、版本 1 及体积未缩小的交易继续使用原样解锁。[SDK 选项](docs/sdk.zh-CN.md) · [构造器与生成方式](reference/README.zh-CN.md#otda-constructor)
      - |-
        | OTDA ALL 场景，单位为字节 | 原始解锁 | 重建解锁 |
        | --- | ---: | ---: |
        | 两进两出整笔 | 870,194 | 316,018 |
        | 首个输入解锁 | 290,109 | 13,023 |
        | 新增一个输入 | 290,277 | 13,189 |
        | 新增一个输出 | 434,814 | 145,022 |
        | 入金与直接退出 | 290,794 | 290,794 |
        | 入金、一次转付和退出 | 1,160,988 | 606,812 |
      - 两种编码用相同的测试密钥和金额，均由 BSV Node 1.2.3 和固定版本的 chain-gang 验证。此表针对模板 `1`，用 `v1.1.0` 测量自动重建，用 `v1.0.0`
        复现原样编码。
  reproduction:
    en:
      - '### Developer checks and cost analysis'
      - |-
        From the reference directory, install the pinned dependencies and run the
        Linux node replay.
      - |-
        ```sh
        cd projects/p2pkh-sm2/reference
        python -m pip install -r requirements.txt
        bash verify.sh
        ```
      - |-
        For SignedData integration, pin the signer key and DER issuer-and-serial
        identifier in trusted wallet configuration. Verify the actual funding
        outpoint, its value, required confirmations and the recipient's lock before
        asking the signer to approve a payment. The GB/T envelope is processed by
        the off-chain adapter. The unlock carries the extracted raw signature.
      - |-
        In the 2×2 fixture, BIP143 ALL uses a 291-byte unlock. The literal OTDA ALL encoding serializes
        both outputs into each input's signing preimage and raises the unlock to
        290,109 bytes. A third output adds 144,925 bytes of output lock and also
        changes both existing OTDA unlocks. The marginal table shows those costs
        separately. Transaction version and the two SignedData version fields apply to their own encodings.
    zh-CN:
      - '### 开发复现与输入输出分析'
      - 在仓库根目录启动 Linux 节点复放。测试环境需要 Python 3.12、Rust 和支持 SM2、SM3 的 OpenSSL。
      - |-
        ```sh
        cd projects/p2pkh-sm2/reference
        python -m pip install -r requirements.txt
        bash verify.sh
        ```
      - 接入 SignedData 的钱包通过可信配置固定签名公钥和完整的 DER 颁发者与序列号。签名前核对被花费的 outpoint、金额、确认数和收款锁。国标封装由链下适配器处理，解锁脚本带的是提取后的原始签名。
      - 两进两出时，BIP143 ALL 的解锁为 291 字节。OTDA ALL 的原始解锁把两个完整输出放进每个输入的签名预映像，解锁增至 290,109 字节。新增第三个输出时，除 144,925
        字节的输出锁本身外，两个已有输入的解锁也会变长。下表分项列出这些开销。交易版本和 SignedData 的两层版本值分别按各自的编码规则处理。
  script_sizes:
    en:
      - <a name="v1110"></a>
      - '### v1.11.0 candidate'
      - Template `10` carries the field prime and `3b` across the scalar windows and reuses the projective
        addition kernel in the public-key table. The 4thGraph `0.2.7` compiler at revision `64624db`
        compared 21 pass and rule plans on 16 fixed comparisons per plan. The selected plan uses
        `rewrite`, `share`, `stack`, and `search`. The new byte-layout compiler binds a packed reversal for six
        32-byte fields. The PUSHTX DER encoder shares that reversal. The OTDA generator scores new
        cache entries discovered in literal spans, then tries removing each selected entry once.
      - |-
        | Measured bytes | v1.10.0 | v1.11.0 |
        | --- | ---: | ---: |
        | Locking script | 95,790 | 94,355 |
        | OTDA constructor | 7,718 | 7,754 |
        | BIP143 ALL, 2 inputs and 2 outputs | 192,284 | 189,414 |
        | OTDA ALL, 2 inputs and 2 outputs | 207,778 | 204,980 |
        | OTDA ALL, 12 inputs and 1 output | 197,213 | 196,210 |
        | OTDA ALL, 24 inputs and 1 output | 310,421 | 309,850 |
        | OTDA ALL, 40 inputs and 1 output | 479,733 | 479,738 |
      - In the 34 shared construction cases, 33 shrink and the native-only destination case stays at
        719 bytes. The 36-case matrix adds 12-input and 24-input payments. A separate 40-input replay
        grows by five bytes because each reconstructed input carries another 36 bytes. In the 2×2 case,
        peak stack payload rises by 29 bytes for BIP143 ALL and falls by 5,740 bytes for OTDA ALL.
      - 'Select template `10` with `--version 10` or SDK `template: "v1.11.0"`. [Compiler tuning](reference/README.md#window-tuning)
        · [Byte bindings](reference/README.md#byte-tuning) · [Template fingerprint](versions/v1.11.0/layout.json) · [Measurements](versions/v1.11.0/measurements.json)
        · [36 transaction cases](versions/v1.11.0/latest-template-coverage.json)'
      - <a name="p2pkh-sponsorship"></a>
      - '#### P2PKH interactions and zero-fee sponsorship'
      - Funded regtest exercised P2PKH funding of template `10`, a same-template SM2 payment with a P2PKH
        fee input, and an SM2 exit to P2PKH with sponsor change. Under the launcher's default policy profile,
        the BIP143 and OTDA cases all admitted and mined those funded transactions.
      - |-
        | Scenario | Funded regtest result |
        | --- | --- |
        | Append a P2PKH fee input before submission | The BIP143 `0xc1` and OTDA `0xe1` SM2 witnesses remained valid with the same outputs. A separately confirmed P2PKH UTXO paid 150,000 sat and the completed transactions mined. |
        | Plan a sponsor change output | The approved transaction paid the full 10,000,000 sat principal to a template `10` or P2PKH output, returned 50,000 sat to the sponsor and paid a 150,000 sat fee. Adding a change output after signing ALL invalidated the SM2 witness. |
        | Submit zero fee first, then try a sponsored replacement | The zero-fee transaction entered the mempool and stayed unmined in three blocks. The same-input sponsored transaction returned `txn-mempool-conflict`. |
        | Pay from a child transaction | Both zero-fee parents included a P2PKH output. A P2PKH child spending that output and a sponsor UTXO paid 150,000 sat. Each parent and child mined in the same block. |
      - The isolated node used a 0.5 sat/B mining floor. The raised-profile run also checks the complete
        scripts on BSV Node and chain-gang and rejects an appended input with ordinary ALL. [Default policy
        replay](versions/v1.11.0/p2pkh-default.json) · [Raised policy replay](versions/v1.11.0/p2pkh-raised.json)
        · [Reproduction](reference/README.md#p2pkh-sponsorship)
      - <a name="v1100"></a>
      - '### v1.10.0 candidate'
      - Template `9` stores fixed generator points as affine X and Y pairs and uses an addition kernel
        specialized for an affine second point. It also reverses 32-byte values by recursively splitting
        the input in half. The 2×2 OTDA ALL payment saves 1,504 bytes. Each reconstructed input carries
        a constructor that is 74 bytes larger. For a 12-input, one-output OTDA ALL payment, the total
        grows from 197,151 to 197,213 bytes.
      - |-
        | Measured bytes | v1.9.0 | v1.10.0 | Change |
        | --- | ---: | ---: | ---: |
        | Locking script | 96,616 | 95,790 | −0.9% |
        | OTDA constructor | 7,644 | 7,718 | +1.0% |
        | BIP143 ALL, 2×2 transaction | 193,936 | 192,284 | −0.9% |
        | OTDA ALL, 2×2 transaction with reconstruction | 209,282 | 207,778 | −0.7% |
      - 'Select template `9` with `--version 9` or SDK `template: "v1.10.0"`. [Template fingerprint](versions/v1.10.0/layout.json)
        · [Measurements](versions/v1.10.0/measurements.json) · [34 latest-template cases](versions/v1.10.0/latest-template-coverage.json)'
      - <a name="v190"></a>
      - '### v1.9.0'
      - Template `8` checks for infinity once per group of five doublings and reuses one copy of the SM2
        field prime throughout the group. SM3 expands message words as compression rounds need them, with
        a rolling schedule of 16 words. The shorter scripts and their byte layout also reduce the OTDA
        constructor for a payment using template `8` throughout.
      - |-
        | Measured bytes | v1.7.0 | v1.9.0 | Change |
        | --- | ---: | ---: | ---: |
        | Locking script | 98,362 | 96,616 | −1.8% |
        | OTDA constructor | 9,447 | 7,644 | −19.1% |
        | BIP143 ALL, 2×2 transaction | 197,428 | 193,936 | −1.8% |
        | OTDA ALL, 2×2 transaction with reconstruction | 216,380 | 209,282 | −3.3% |
        | OTDA ALL, unlocking script per input in that transaction | 9,767 | 7,964 | −18.5% |
      - In the 34-case transaction matrix, 33 transactions are smaller and the native-only destination
        case has the same size. Six-input, two-output OTDA ALL falls from 256,604 to 242,294 bytes.
      - 'Select template `8` for new outputs with `--version 8` or SDK `template: "v1.9.0"`. [Template
        fingerprint](versions/v1.9.0/layout.json) · [Recorded measurements](versions/v1.9.0/measurements.json)
        · [34 latest-template cases](versions/v1.9.0/latest-template-coverage.json)'
      - <a name="v180"></a>
      - '### v1.8.0'
      - The wallet uses a shared OTDA constructor when an ALL payment includes outputs of both templates
        `6` and `7`. It emits the common prefix once, then rebuilds both suffixes from shared byte spans.
        The same constructor applies with ANYONECANPAY. This release uses the existing locking templates
        and selects the shared encoding automatically when it is the shortest candidate.
      - |-
        | Measured bytes | v1.7.0 | v1.8.0 | Change |
        | --- | ---: | ---: | ---: |
        | Constructor for both templates | 18,810 | 9,681 | −48.5% |
        | OTDA ALL, 2×2 transaction with mixed outputs | 237,409 | 219,151 | −7.7% |
        | OTDA ALL, unlocking script per input in that transaction | 19,131 | 10,002 | −47.7% |
      - The comparison uses the same inputs, output order and signing preimages. [Constructor](versions/v1.8.0/mixed-otda-constructor.json)
        · [Reproduction](reference/README.md#mixed-otda-constructor) · [Recorded measurements](versions/v1.8.0/measurements.json)
      - <a name="latest-template-coverage"></a>
      - '#### Payments using template 7'
      - The matrix uses v1.7.0 for every SM2 prevout and recipient. The v1.7.0 and v1.8.0 wallet revisions
        produced identical transaction IDs and sizes for all 34 cases. The shared constructor requires
        both templates `6` and `7` among the signed outputs, so the additional savings in this matrix
        are zero.
      - The existing single-template OTDA constructor still reduces eligible transactions compared with
        literal preimages. BSV Node 1.2.3 and chain-gang verified both encodings in every case. The matrix
        covers all 12 sighash types, paired and unpaired SINGLE, different input and output counts, multiple
        prevouts from one funding transaction, native P2PKH inputs and outputs, and a transaction with
        253 outputs. [Per-case sizes and transaction IDs](versions/v1.8.0/latest-template-coverage.json)
        · [Reproduction](reference/README.md#latest-template-coverage)
      - <a name="v170"></a>
      - '### v1.7.0'
      - The verifier computes `sG + tQ` with signed radix-32 digits. Each table holds magnitudes 0 through
        16, with Y negated for negative digits. This reduces the unrolled window count from 64 to 52 and
        the scalar multiplication block from 40,158 to 37,854 bytes.
      - |-
        | Measured bytes | v1.6.0 | v1.7.0 | Change |
        | --- | ---: | ---: | ---: |
        | Locking script | 100,663 | 98,362 | −2.3% |
        | BIP143 ALL, 2×2 transaction | 202,030 | 197,428 | −2.3% |
        | OTDA ALL, 2×2 transaction with reconstruction | 220,814 | 216,380 | −2.0% |
        | OTDA ALL, unlocking script per input in that transaction | 9,683 | 9,767 | +0.9% |
      - 'Select template `7` for a new output with `--version 7` or SDK `template: "v1.7.0"`. One OTDA
        ALL preimage can contain reconstructed outputs of all seven templates. [Forth lock](../../src/fourthgraph/stdlib/wallet/p2pkh-sm2.fth)
        · [Template fingerprint](versions/v1.7.0/layout.json) · [Recorded measurements](versions/v1.7.0/measurements.json)'
      - <a name="v160"></a>
      - '### v1.6.0'
      - SM3 rotates a word left by multiplying it by the corresponding power of two, splitting the eight-byte
        product into two 32-bit halves, and combining them with `OP_OR`. Selected round words stay in
        five-byte form across bitwise operations. The ZA and message hash programs together save 10,084
        bytes per output. The OTDA constructor finds reusable spans in the resulting bytecode.
      - |-
        | Measured bytes | v1.5.0 | v1.6.0 | Change |
        | --- | ---: | ---: | ---: |
        | Locking script | 110,747 | 100,663 | −9.1% |
