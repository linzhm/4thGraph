$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: Pure ML-DSA-44
  zh-CN: 纯模式 ML-DSA-44
summary:
  en: Make a lock from the raw ML-DSA-44 public key and sign the payment message in Pure mode with an
    empty context.
  zh-CN: 用原始 ML-DSA-44 公钥生成付款锁，再用纯模式和空上下文签署付款消息。
entry_points:
  - name: fips204.verify(public_key, message, signature, context=...)
    description:
      en: Verify a byte message and optional context in Python.
      zh-CN: Python 纯模式消息验签
  - name: script.verify_message_script(public_key, message_bytes, context=...)
    description:
      en: Compile the Script verifier. The public key, byte length and context are fixed at generation.
        The message and signature go on the stack.
      zh-CN: 生成固定公钥、消息长度和上下文的消息验签脚本
  - name: script.locking_script(public_key)
    description:
      en: Bind the same verifier to the current input. It verifies the signature over a 32-byte transaction
        digest with the empty context.
      zh-CN: 生成绑定当前花费输入的付款锁
setup:
  en:
    - Run the release commands from the repository root with Python 3.12, OpenSSL 3.5 or later, and the
      pinned Chronicle SDK dependencies.
    - |-
      ```sh
      python -m pip install -r tools/requirements-chronicle.txt
      ```
  zh-CN:
    - 从仓库根目录使用 Python 3.12、OpenSSL 3.5 或更新版本及固定的 Chronicle 依赖。
    - |-
      ```sh
      python -m pip install -r tools/requirements-chronicle.txt
      ```
sections:
  use_cases:
    en:
      - Evaluate Pure ML-DSA-44 when measuring FIPS 204 signer interoperability or large-script resource limits.
        A lab can start with the detached conformance vectors and then run the payment wrapper with the same kind
        of public key and a dedicated payment signer. The wrapper passes a 32-byte payment message to Pure ML-DSA-44
        with an empty context. Key and signature validation, transaction binding, and node admission each have their
        own evidence. [Reproduction steps](#reproduce-the-checks)
      - The fixed-key payment lock is about 252 kB in the measured fixtures. Evaluate script size, transaction size
        and validation policy on the target node or miner before choosing this format for a funded workflow. [Funded
        regtest method](../../docs/benchmark.md#funded-regtest-measurements)
    zh-CN:
      - 验证 FIPS 204 签名器互操作，或测量大脚本资源限制时，可以评估纯模式 ML‑DSA‑44。实验可先跑独立的算法合规向量，再用相同类型的公钥及专用付款签名器验证付款封装。付款封装把 32 字节的付款消息交给纯模式
        ML‑DSA‑44，使用空上下文。公钥和签名校验、交易绑定，以及节点接收策略应各自核验。[复现与验证](#复现方法)
      - 实测夹具的固定公钥付款锁约为 252 kB。如果计划对这种输出实际入金，应先在目标节点或矿工环境验证脚本大小、整笔交易上限及验证策略。[出块测量方法](../../docs/benchmark.zh-CN.md)
  algorithm:
    en:
      - '[Protocol](docs/developer.en.md#protocol) · [Security](docs/developer.en.md#security) · [Verify](#reproduce-the-checks)
        · [Transaction costs](#complete-transactions-and-stack-measurements)'
      - |-
        ML-DSA is the post-quantum digital signature algorithm standardized in NIST
        FIPS 204. It derives from CRYSTALS-Dilithium and relies on the computational
        hardness of module-lattice problems. ML-DSA-44 targets NIST security category 2
        and has the smallest public key and signature of the three parameter sets, at
        1,312 and 2,420 bytes respectively. The two 4s in the name refer to the
        dimensions of its 4 × 4 public matrix.
        [NIST FIPS 204](https://csrc.nist.gov/pubs/fips/204/final)
      - |-
        The verifier checks the signature encoding, response bounds and canonical
        hints. It uses the number-theoretic transform (NTT) for polynomial arithmetic
        and SHAKE256 to recompute the challenge and check it against the encoded one.
        When building a BSV payment lock, the Script compiler precomputes the matrix
        and transformed public-key polynomials for the fixed key. [Script verifier](reference/script.py)
      - |-
        The payment wrapper supports all twelve BIP143 and Chronicle OTDA sighash
        combinations. Unpaired OTDA `SINGLE` uses the companion BIP143 binding.
        The wallet checks the funding output before requesting an
        external signature. The caller authenticates the funding transaction and
        approves the transaction intent.
        [Transaction-binding construction](../../src/fourthgraph/bsv/pushtx.py)
      - '### Sampling boundary'
      - |-
        Python and Script use the same 221-byte SHAKE256 output budget specified by
        FIPS 204 Appendix C, Table 3. It includes eight sign bytes and up to 213
        candidate indices for 39 selections. At exhaustion the verifier fails. The
        Script sampler discards its intermediate stack values before failing.
        [Sampler](reference/challenge_script.py)
    zh-CN:
      - '[协议规范](docs/developer.zh-CN.md#protocol) · [安全分析](docs/developer.zh-CN.md#security) · [复现与验证](#复现方法) ·
        [交易成本](#完整交易与栈测量)'
      - ML-DSA 是 NIST 在 FIPS 204 中标准化的后量子数字签名算法，源自 CRYSTALS-Dilithium，安全性基于模格问题的计算困难性。ML-DSA-44 面向 NIST 第 2 类安全目标，在三套标准参数中公钥和签名最小，分别为
        1,312 和 2,420 字节。名称中的两个 4 对应 4 × 4 的公开矩阵。[NIST FIPS 204](https://csrc.nist.gov/pubs/fips/204/final)
      - 验签先检查签名编码、响应范数和提示值，再用数论变换（NTT）进行多项式运算，并用 SHAKE256 重算并核对挑战。本项目在生成 BSV 付款锁时，会为固定公钥预计算矩阵和变换后的公钥多项式。[Script
        验签实现](reference/script.py)
      - 挑战采样遵循 FIPS 204 附录 C 表 3 的 221 字节上限，耗尽时验签失败。消息验签和付款绑定分别有测试向量。 [采样实现](reference/challenge_script.py) · [确定性向量](versions/v0.1.0/deterministic.json)
  reproduction:
    en:
      - The OpenSSL fixture uses a public test seed and deterministic signing.
      - |-
        ```sh
        python -m unittest discover -s projects/ml-dsa/reference -p test_mldsa.py -v
        python projects/ml-dsa/reference/check_chain_gang.py -v
        python projects/ml-dsa/reference/test_shake_script.py -v
        python projects/ml-dsa/reference/test_signature_script.py -v
        python projects/ml-dsa/reference/test_challenge_script.py -v
        python projects/ml-dsa/reference/test_boundaries.py -v
        python projects/ml-dsa/reference/test_payment.py -v
        ```
      - Both engines matched 276 component boundary checks and 18 complete-payment boundary checks. [Boundary checks](reference/payment-acceptance.md#boundary-rejection)
      - |-
        The Python verifier matched OpenSSL-generated test fixtures and all 80
        standard ML-DSA-44 Wycheproof cases. The bounded Python verifier and the
        detached Script verifier matched all 15 NIST ACVP external Pure ML-DSA-44
        sigVer cases, including messages up to 8,192 bytes and contexts up to 255 bytes.
        The payment format uses the empty context and a 32-byte transaction digest.
        Set the variables below to the local corpus files before running the checks.
        Use `ML_DSA_OPENSSL` to select a compatible OpenSSL executable.
      - |-
        ```sh
        python projects/ml-dsa/reference/check_wycheproof.py "$WYCHEPROOF_VECTORS"
        PYTHONPATH=src:. python projects/ml-dsa/reference/check_acvp.py "$ACVP_PROMPT" "$ACVP_EXPECTED"
        ```
      - |-
        [Pinned Wycheproof corpus](https://github.com/C2SP/wycheproof/blob/8e7fa6f87e6993d7b613cf48b46512a32df8084a/testvectors_v1/mldsa_44_standard_verify_test.json)
        · [NIST ACVP sigVer corpus](https://github.com/usnistgov/ACVP-Server/tree/master/gen-val/json-files/ML-DSA-sigVer-FIPS204)
      - |-
        The ACVP inputs used Git blob IDs `22b0803253f7aa24644229acd04c387d260e874a`
        for `prompt.json` and `dba8bcfe5f090503c9390701c11677389752cecd` for
        `expectedResults.json`.
      - |-
        The payment fixture enumerates 640 unique cases across transaction versions 1
        and 2, Genesis BIP143 and Chronicle OTDA, paired and unpaired `SINGLE`, ordered
        prevout eras, and three single changes. Its coverage record gives the exact
        domain and expected decisions. [Payment acceptance](reference/payment-acceptance.md)
      - |-
        Set `ML_DSA_BSVS` to the executable `bsvs` path to repeat the Lean comparison.
        The native replay uses an explicit script policy limit. The shared launchers
        set `-maxscriptsizepolicy=100000000` alongside the existing
        transaction-size and stack-memory limits. An isolated regtest can repeat the
        matrix through `REGTEST_COOKIE` and `REGTEST_URL`.
        [Shared regression evidence](../../docs/chronicle-regression.md)
    zh-CN:
      - OpenSSL 夹具使用公开测试种子。
      - |-
        ```sh
        python -m pip install -r tools/requirements-chronicle.txt
        python -m unittest discover -s projects/ml-dsa/reference -p test_mldsa.py -v
        python projects/ml-dsa/reference/check_chain_gang.py -v
        python projects/ml-dsa/reference/test_shake_script.py -v
        python projects/ml-dsa/reference/test_signature_script.py -v
        python projects/ml-dsa/reference/test_challenge_script.py -v
        python projects/ml-dsa/reference/test_boundaries.py -v
        python projects/ml-dsa/reference/test_payment.py -v
        ```
      - 两个引擎均通过 276 项组件边界判定和 18 项完整付款边界判定。[边界测试](reference/payment-acceptance.md#boundary-rejection)
      - 测试覆盖 80 条 Wycheproof 标准验签用例、15 条 NIST ACVP 外部纯模式向量及 640 个付款判定组合。详见[统一节点回归](../../docs/chronicle-regression.md)。Linux
        节点重放使用统一入口的脚本策略配置。
      - |-
        将三个环境变量设为本地语料文件后，可以通过以下命令单独重放。若系统的 OpenSSL 版本较低，可以用
        `ML_DSA_OPENSSL` 指向支持 ML-DSA 的可执行文件。
      - |-
        ```sh
        python projects/ml-dsa/reference/check_wycheproof.py "$WYCHEPROOF_VECTORS"
        PYTHONPATH=src:. python projects/ml-dsa/reference/check_acvp.py "$ACVP_PROMPT" "$ACVP_EXPECTED"
        ```
      - '[固定 Wycheproof 语料](https://github.com/C2SP/wycheproof/blob/8e7fa6f87e6993d7b613cf48b46512a32df8084a/testvectors_v1/mldsa_44_standard_verify_test.json)
        · [NIST ACVP 验签语料](https://github.com/usnistgov/ACVP-Server/tree/master/gen-val/json-files/ML-DSA-sigVer-FIPS204)'
  script_sizes:
    en:
      - These are Script bytes for identical fixtures, before transaction serialization.
      - |-
        | Component | PR #68 baseline | Compact `879b52c` | v0.2.0 | v0.3.0 | v0.4.0 | v0.5.0 | v0.6.0 | v0.7.0 | v0.8.0 | v0.9.0 | v0.10.0 | v0.11.0 |
        |---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|
        | Fixed-key verification equation | 500,794 | 310,198 | 257,122 | 137,874 | 137,874 | 137,874 | 124,849 | 124,849 | 127,876 | 122,627 | 122,627 | 122,627 |
        | Signature decoding | 62,723 | 46,392 | 36,152 | 36,152 | 28,224 | 28,224 | 28,224 | 28,224 | 6,007 | 6,007 | 6,007 | 6,007 |
        | SampleInBall with the 221-byte budget | 70,229 | 63,701 | 61,101 | 61,101 | 61,101 | 45,211 | 43,512 | 40,827 | 40,827 | 40,827 | 30,638 | 25,717 |
        | Apply hints and encode high bits | 89,687 | 66,135 | 66,135 | 66,135 | 31,087 | 31,087 | 31,087 | 23,389 | 23,389 | 11,829 | 11,829 | 11,829 |
        | Standalone Keccak-f[1600] with little-endian lanes | 25,097 | 21,833 | 20,533 | 20,533 | 20,533 | 12,588 | 12,588 | 12,588 | 12,588 | 12,588 | 12,588 | 12,588 |
        | SHAKE256, 832-byte input to 32-byte output | 176,542 | 153,694 | 144,594 | 144,594 | 144,594 | 88,979 | 81,821 | 79,133 | 79,133 | 79,133 | 74,766 | 74,023 |
        | Current-input binding | 718 | 718 | 718 | 718 | 718 | 506 | 506 | 506 | 506 | 506 | 506 | 506 |
        | Complete payment lock | 926,403 | 663,284 | 586,981 | 467,733 | 424,757 | 345,095 | 322,447 | 308,992 | 289,802 | 272,993 | 257,662 | **251,704** |
        | One-input BIP143 `ALL` unlock | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 |
      - The Forth payment entry uses `stack` optimization on upstream revision `889ff6e`. v0.5.0 emits Keccak's
        theta and chi over five-lane rows. Theta masks the one-bit shifts at lane boundaries, and rho and pi operate
        on individual lanes. Ten permutations in the payment lock save 79,450 bytes. The shared compact input binding
        saves another 212 bytes. [Forth entry](reference/payment-lock.fth) · [v0.4.0 measurements](versions/v0.4.0/measurements.json)
        · [v0.5.0 measurements](versions/v0.5.0/measurements.json)
      - v0.6.0 applies two adjacent NTT butterfly stages to each four-coefficient group at the top of the stack.
        Bounds on the centered transforms allow a modulus-aligned offset that keeps each packed lane below its sign
        bit, saving 13,025 bytes together with the paired butterflies. SHAKE keeps its internal lanes big-endian
        across permutations and converts only absorbed and squeezed bytes, saving another 9,623 bytes in the lock.
        [v0.6.0 measurements](versions/v0.6.0/measurements.json)
      - v0.7.0 applies each sparse hint by shifting its residue by one rounding interval modulo q−1, then encodes
        the high bits in one scan with shared constants. This saves 7,698 bytes. Keeping the challenge coefficients
        in one signed byte each saves 1,917 bytes. Keccak applies chi as soon as each rho/pi row is ready and moves
        it off the main stack, saving 384 bytes per permutation and 3,840 bytes per lock. [v0.7.0 measurements](versions/v0.7.0/measurements.json)
      - v0.8.0 checks the strict response norm in 64-coefficient blocks in the original 18-bit encoding. A guard
        bit in each lane prevents borrows between lanes. The NTT reads the checked wire response directly, reuses
        the modulus across pointwise products, and concatenates fixed-width inverse input lanes. The signature decoder
        is 22,217 bytes smaller and the equation grows by 3,027 bytes, for a net reduction of 19,190 bytes. [v0.8.0
        measurements](versions/v0.8.0/measurements.json)
      - v0.9.0 complements the wire response and subtracts one bias from all four packed response lanes at once.
        The NTT reuses the forward bias and modulus at fixed stack depths. Together with the fixed-depth inverse
        bias, this saves 5,249 bytes in the equation. A reciprocal multiplication rounds 64 hint-adjusted residues
        in parallel. A second multiplication gathers four six-bit digits at a time into the FIPS 204 encoding, saving
        11,560 bytes in hint application and encoding. [v0.9.0 measurements](versions/v0.9.0/measurements.json)
      - v0.10.0 makes a mask of acceptable draws with a parallel byte comparison, then bisects it to find the first
        acceptable byte for each SampleInBall selection. The original 221-byte budget still applies, including the
        sign bytes. This saves 8,683 bytes in the sampler. SHAKE swaps byte groups in parallel when converting the
        rate block and uses the shorter shift for some Keccak rotations, saving 6,648 bytes in the lock. [v0.10.0
        measurements](versions/v0.10.0/measurements.json)
      - v0.11.0 locates the first accepted draw by subtracting one from the nonzero acceptance mask and XORing the
        result with the mask. The minimal byte length of the result identifies the draw and saves 4,560 bytes in
        the sampler. SHAKE constructs zero padding and capacity in Script and absorbs the first block directly into
        the empty state, saving another 1,398 bytes. [v0.11.0 measurements](versions/v0.11.0/measurements.json)
      - The arithmetic and SHAKE scripts are also independently replayable. [Deterministic fixture](versions/v0.1.0/deterministic.json)
    zh-CN:
      - <a name="脚本大小"></a>
      - 下表用相同夹具比较编译后的 Script 字节数。公钥内容会使锁的长度略有变化，OTDA ALL 的每个输入还会携带整笔交易的输出。
      - |-
        | 组件 | PR #68 基线 | 紧凑版 `879b52c` | v0.2.0 | v0.3.0 | v0.4.0 | v0.5.0 | v0.6.0 | v0.7.0 | v0.8.0 | v0.9.0 | v0.10.0 | v0.11.0 |
        |---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|
        | 固定公钥验证方程 | 500,794 | 310,198 | 257,122 | 137,874 | 137,874 | 137,874 | 124,849 | 124,849 | 127,876 | 122,627 | 122,627 | 122,627 |
        | 签名解码 | 62,723 | 46,392 | 36,152 | 36,152 | 28,224 | 28,224 | 28,224 | 28,224 | 6,007 | 6,007 | 6,007 | 6,007 |
        | SampleInBall（221 字节预算） | 70,229 | 63,701 | 61,101 | 61,101 | 61,101 | 45,211 | 43,512 | 40,827 | 40,827 | 40,827 | 30,638 | 25,717 |
        | 应用提示并编码高位 | 89,687 | 66,135 | 66,135 | 66,135 | 31,087 | 31,087 | 31,087 | 23,389 | 23,389 | 11,829 | 11,829 | 11,829 |
        | 独立 Keccak-f[1600] 置换（小端 lane） | 25,097 | 21,833 | 20,533 | 20,533 | 20,533 | 12,588 | 12,588 | 12,588 | 12,588 | 12,588 | 12,588 | 12,588 |
        | SHAKE256（832 字节输入、32 字节输出） | 176,542 | 153,694 | 144,594 | 144,594 | 144,594 | 88,979 | 81,821 | 79,133 | 79,133 | 79,133 | 74,766 | 74,023 |
        | 当前输入绑定 | 718 | 718 | 718 | 718 | 718 | 506 | 506 | 506 | 506 | 506 | 506 | 506 |
        | 完整付款锁 | 926,403 | 663,284 | 586,981 | 467,733 | 424,757 | 345,095 | 322,447 | 308,992 | 289,802 | 272,993 | 257,662 | **251,704** |
        | 单输入 BIP143 ALL 解锁 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 | 2,588 |
      - Forth 付款入口用上游 `889ff6e` 以 `stack` 模式编译。v0.5.0 按五个 lane 一行执行 Keccak 的 θ 和 χ。θ 用位掩码隔离跨 lane 的移位，ρ 和 π 按单个
        lane 执行。付款锁的十次置换共省 79,450 字节，共享紧凑输入绑定再省 212 字节。[Forth 入口](reference/payment-lock.fth) · [v0.4.0 测量](versions/v0.4.0/measurements.json)
        · [v0.5.0 测量](versions/v0.5.0/measurements.json)
      - v0.6.0 把每组四个系数保留在栈顶，连续执行相邻两层 NTT 蝶形。根据变换的幅值上界选取模数的整数倍作为偏移，使每个打包系数的符号位保持为零。这两项共省 13,025 字节。SHAKE 在多次置换之间保持内部
        lane 为大端，只在吸收和挤出时转换字节序，再省 9,623 字节。[v0.6.0 测量](versions/v0.6.0/measurements.json)
      - v0.7.0 先按模 q−1 将稀疏提示对应的系数移动一个舍入区间，再共用常量，一次扫描完成高位编码，节省 7,698 字节。挑战系数改用单字节带符号编码，节省 1,917 字节。Keccak 每生成一行 ρ/π
        的结果就执行 χ，再将该行移出主栈，每次置换节省 384 字节，整锁节省 3,840 字节。[v0.7.0 测量](versions/v0.7.0/measurements.json)
      - v0.8.0 在原始 18 位响应编码上每 64 个系数批量检查严格范数上限。每个系数的保护位阻止跨系数借位。NTT 直接读取已检查的响应，点积阶段复用模数，并拼接定宽数据作为逆变换输入。签名解码缩小 22,217
        字节，验证方程增加 3,027 字节，整锁净减 19,190 字节。[v0.8.0 测量](versions/v0.8.0/measurements.json)
      - v0.9.0 对响应编码按位取反，再一次性扣除四个打包响应系数的偏移。NTT 在固定栈深复用正变换偏移、模数和逆变换偏移，验证方程共省 5,249 字节。提示修正后，每 64 个系数同时用倒数乘法舍入，再用乘法把每四个六位值收拢成
        FIPS 204 编码，提示和编码共省 11,560 字节。[v0.9.0 测量](versions/v0.9.0/measurements.json)
      - v0.10.0 并行比较候选字节，再二分定位每次 SampleInBall 选取时第一个可接受的字节。含符号位在内的预算仍是 221 字节，采样本身节省 8,683 字节。SHAKE 并行交换各 lane 内的字节组，并用更短的移位指令完成部分
        Keccak 旋转，整锁再省 6,648 字节。[v0.10.0 测量](versions/v0.10.0/measurements.json)
      - v0.11.0 将非零接受掩码减一后与原掩码异或，利用结果的最短字节长度定位首个合格候选，采样节省 4,560 字节。SHAKE 在 Script 中生成填充和容量区的零字节，并将首块直接吸收到空状态，再省
        1,398 字节。[v0.11.0 测量](versions/v0.11.0/measurements.json)
  integration:
    en:
      - |-
        Use `locking_script(public_key)` to create a compact payment output and retain
        the authenticated 1,312-byte public key. The wallet recognizes and spends
        the eleven earlier generations for that key. Use `locking_script(public_key, legacy=True)`
        to reproduce the original v0.1.0 lock bytes. Before authorizing a payment, verify the
        funding amount, outpoint and confirmations. Call `sign_payment`
        for a single-input payment or `sign_spend` for an already prepared input.
        The callback signs the supplied 32 bytes as the message with Pure ML-DSA-44
        and an empty context. It returns the 2,420-byte standard signature for
        verification and witness assembly. The message verifier can separately test
        variable-length messages and permitted contexts. [Wallet source](reference/payment.py)
      - |-
        Fixed-key script generation can serialize different keys to slightly different
        lengths. In OTDA ALL, each witness carries the full serialized outputs, which
        amplifies the savings from smaller output locks.
    zh-CN:
      - |-
        1. 调用 `locking_script(public_key)` 生成新版付款输出，并保存经认证的完整公钥。钱包可用同一公钥识别和花费此前十一版锁。用 `locking_script(public_key, legacy=True)` 可复现最初的 v0.1.0 锁。签名前核对 outpoint、金额、确认数和预期收款输出。
        2. 单输入付款用 `sign_payment`，已排好输入输出的交易逐输入调用 `sign_spend`。付款支持 BIP143 与 Chronicle OTDA 的十二种签名模式，无配对 OTDA SINGLE 使用伴随绑定。
        3. 外部签名器把收到的 32 字节作为纯模式的消息，使用空上下文并返回 2,420 字节签名。钱包验签后构造解锁脚本。通用消息验签可另行指定上下文和消息长度。
      - '[付款接口](reference/payment.py) · [付款验收矩阵](reference/payment-acceptance.md) · [验证绑定实现](../../src/fourthgraph/bsv/pushtx.py)'
  transactions:
    en:
      - BSV Node 1.2.3 and the pinned chain-gang validate these transactions with supplied prevouts. Sizes are in
        bytes and follow input and output order. `× n` indicates n equal sizes. The development evaluator lacks
        the comparison opcodes needed for stack measurements. The two-input, two-output transactions measured 520,616
        bytes for BIP143 ALL and 1,551,168 bytes for OTDA ALL in v0.10.0.
      - |-
        | Template and mode | Inputs×outputs | Previous locks | Unlocks | New locks | Total | Main / alt items | Stack payload |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | `pure-ml-dsa-44` · `0x41` | 2×2 | 251,702 / 251,704 | 2,588 × 2 | 251,701 × 2 | 508,700 | — / — | — |
        | `pure-ml-dsa-44` · `0x61` | 2×2 | 251,708 / 251,700 | 505,950 × 2 | 251,694 / 251,700 | 1,515,420 | — / — | — |
    zh-CN:
      - BSV Node 1.2.3 和项目固定的 chain-gang 版本用显式提供的上一输出验证了新版锁的完整交易。表中大小以字节计，按输入和输出顺序排列，`× n` 表示相同大小重复 n 次。开发求值器缺少所需的比较指令，暂无栈峰值。v0.10.0
        的两进两出夹具在 BIP143 ALL 和 OTDA ALL 下分别为 520,616 和 1,551,168 字节。
      - |-
        | 模板与模式 | 输入×输出 | 上一输出锁定 | 解锁 | 新输出锁定 | 整笔 | 主栈 / 备用栈 | 两栈载荷 |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | `pure-ml-dsa-44` · `0x41` | 2×2 | 251,702 / 251,704 | 2,588 × 2 | 251,701 × 2 | 508,700 | — / — | — |
        | `pure-ml-dsa-44` · `0x61` | 2×2 | 251,708 / 251,700 | 505,950 × 2 | 251,694 / 251,700 | 1,515,420 | — / — | — |
  lifecycle:
    en:
      - Each marginal cell shows the **change in total bytes (output locks / input unlocks / other bytes)**. Other
        bytes include values, outpoints, sequence numbers, and CompactSize fields. Previous locks identify the coins
        being spent and belong to their funding transactions. Both lifecycle totals include native P2PKH funding
        and exit. The second adds one payment between project outputs.
      - |-
        | Template and mode | Added-input shape | Added-input bytes | Added-output shape | Added-output bytes | Fund and exit | One turnover |
        | --- | --- | --- | --- | --- | --- | --- |
        | `pure-ml-dsa-44` · `0x41` | 3×2 | 2,635 (4 / 2,588 / 43) | 2×3 | 251,708 (251,695 / 0 / 13) | 508,934 | 1,017,626 |
        | `pure-ml-dsa-44` · `0x61` | 3×2 | 506,102 (-4 / 506,061 / 45) | 2×3 | 755,130 (251,697 / 503,420 / 13) | 508,946 | 2,024,357 |
      - '[Unified benchmark and reproduction](../../docs/benchmark.md)'
    zh-CN:
      - 每个边际单元格为 **新增整笔字节（输出锁定脚本 / 输入解锁脚本 / 其余序列化字节）**。其余字节包括金额、outpoint、序列号和 CompactSize 等字段。上一输出脚本列用于说明被花费的锁，该脚本长度属于此前创建
        UTXO 的交易。生命周期从原生 P2PKH 入金开始，以原生 P2PKH 退出，周转列在两者之间增加一次项目内转付。
