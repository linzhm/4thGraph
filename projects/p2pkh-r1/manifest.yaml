$schema: ../template/manifest.schema.json
schema_version: 1
title:
  en: P2PKH-R1
  zh-CN: P2PKH-R1
summary:
  en: P2PKH-R1 lets a BSV wallet use an existing P-256 signer. The output commits to the recipient's public-key
    HASH160. A spend supplies the uncompressed public key and a 64-byte ECDSA signature in `r || s` format.
  zh-CN: P2PKH-R1 让 BSV 钱包接入已有的 P‑256 签名器。输出锁定到收款公钥的 HASH160，花费时提供未压缩公钥和 64 字节的 ECDSA 签名 `r || s`。
entry_points:
  - name: locking_script_from_public_key
    description:
      en: Build the selected wallet template from an uncompressed P-256 public key.
      zh-CN: 用未压缩的 P-256 公钥构造选定的钱包模板。
  - name: sign_payment
    description:
      en: Authorize a payment using an external P-256 digest signer.
      zh-CN: 用外部 P-256 摘要签名器为付款授权。
setup:
  en:
    - Run the release commands from the repository root in the compiler experiment environment. [Dependencies
      and replay profiles](forth/README.md)
  zh-CN:
    - 在编译器实验环境中从仓库根目录运行版本命令。[依赖与复放配置](forth/README.md)
sections:
  algorithm:
    en:
      - '[Protocol](docs/spec.en.md) · [Security](docs/developer.en.md#security) · [Verification](reference/acceptance.md)'
      - The payment lock checks the revealed public key against the owner HASH160, verifies the P-256
        signature in Script, and binds the signed digest to the current input. [Wire specification](docs/spec.en.md)
    zh-CN:
      - '[协议规范](docs/spec.zh-CN.md) · [安全分析](docs/developer.zh-CN.md#security) · [验收记录](reference/acceptance.md)'
      - 付款锁检查公开的公钥与所有者 HASH160 是否匹配，在 Script 中验证 P-256 签名，并将已签摘要绑定到当前输入。[线格式规范](docs/spec.zh-CN.md)
  reproduction:
    en:
      - The selected compiler release and the wallet’s default template have separate manifests. Use the
        compiler guide for the full replay procedure and the acceptance record for the payment matrix.
        [Compiler experiment](forth/README.md) · [Payment acceptance](reference/acceptance.md)
    zh-CN:
      - 选定的编译器版本和钱包默认模板分别归档。完整复放流程见编译器指南，付款矩阵见验收记录。[编译器实验](forth/README.md) · [付款验收](reference/acceptance.md)
  integration:
    en:
      - '### Wallet integration'
      - Select **v0.8.0** to use the current compiler template with the unified SDK in TypeScript, Rust, Go, or
        Python. The default wallet template is v0.2.0. For an existing P-256 signer, confirm its
        digest interface and signature encoding, and persist nonce-reuse history across signing processes.
        [SDK guide](docs/sdk.en.md) · [Reference wallet](reference/README.md) · [v0.8.0 layout](versions/v0.8.0/layout.json)
      - R1 creates the full lock at funding so the recipient can pay in one spend. Deferred R1 uses a
        smaller deposit lock and a separate activation transaction. [Deferred workflow](../p2pkh-r1-deferred/README.md)
    zh-CN:
      - '### 钱包接入'
      - 在 TypeScript、Rust、Go 或 Python 的统一 SDK 中选择 **v0.8.0**，即可使用当前编译模板。钱包默认模板为 v0.2.0。接入已有 P‑256 签名器时，核对设备的摘要接口和签名编码，并跨签名进程持久保存随机数重复检测记录。
        [SDK 指南](docs/sdk.zh-CN.md) · [参考钱包](reference/README.md) · [v0.8.0 布局](versions/v0.8.0/layout.json)
      - R1 在入金时创建完整付款锁，收款人可用一次花费付款。Deferred R1 用较小的入金锁，并在独立的交易中启用。 [Deferred 流程](../p2pkh-r1-deferred/README.zh-CN.md)
  transactions:
    en:
      - <a name="version-history"></a>
      - <a name="forth-experiment"></a>
      - '### Measured results'
      - '#### v0.7.0 → v0.8.0'
      - '**v0.8.0** saves **148 B per lock**, **296 B per BIP143 ALL payment**, and **1,020 B
        per OTDA payment** in each of the two measured OTDA modes. Payment sizes count the two-input,
        two-output spend. [Version manifest](versions/v0.8.0/manifest.json) · [Build and replay](forth/README.md)'
      - |-
        | Version | Compiler construction | Lock | BIP143 ALL payment | OTDA ALL payment | OTDA SINGLE payment |
        | --- | --- | ---: | ---: | ---: | ---: |
        | v0.7.0 | Affine fixed table with a shorter zero guard | 41,262 B | 83,294 B | 94,632 B | 94,561 B |
        | **v0.8.0** | Compact fixed table and shared OTDA fragments | **41,114 B** | **82,998 B** | **93,612 B** | **93,541 B** |
      - The compiler stores only X and Y in the fixed-generator table, using its proof that nonzero entries
        have `Z=1`. The OTDA constructor reuses repeated byte strings and reconstructs the same lock byte
        for byte. The iteration reuses the existing Forth source. Funded BSV Node and independent chain-gang
        replay passed for all three modes. The selected template also passed the R1 acceptance matrix.
        [Forth entry](forth/r1-baseline.fth) · [Optimization plan](versions/v0.8.0/plan.json) ·
        [Version comparison](versions/v0.8.0/comparison.json) ·
        [Acceptance matrix](reference/acceptance.md)
      - |-
        <details>
        <summary>Earlier version iterations</summary>

        Each row shows the validated template selected that round. Payments use two inputs and two outputs.

        | Previous selection | Selected template | Main improvement | Lock | BIP143 ALL | OTDA ALL |
        | --- | --- | --- | ---: | ---: | ---: |
        | — | v0.1.0 | First fixed lock with literal OTDA preimages | 59,582 B | 119,934 B | 358,194 B |
        | v0.1.0 | v0.2.0 | Reschedule P-256 arithmetic and share curve kernels in OTDA reconstruction | 46,302 B | 93,374 B | 101,250 B |
        | v0.2.0 | Forth v0.3.0 | Generate the full lock from Forth and shorten 263 point doublings | 45,776 B | 92,322 B | 100,192 B |
        | Forth v0.3.0 | Forth v0.4.0 | Express point arithmetic as bounded formulas and let the compiler rewrite and schedule them | 42,536 B | 85,842 B | 93,664 B |
        | Forth v0.4.0 | v0.5.0 (`split-5x4`) | Compile the double-scalar multiplication with a 5-bit fixed table and a 4-bit public-key table to reduce loop additions | 41,721 B | 84,212 B | 95,282 B |
        | v0.5.0 | v0.6.0 | Prove `Z=1` for nonzero fixed-generator entries and specialize 51 point additions | 41,364 B | 83,498 B | 94,864 B |
        | v0.6.0 | v0.7.0 | Shorten the zero-digit guard at each fixed-generator lookup | 41,262 B | 83,294 B | 94,632 B |

        The main sequence selects templates by lock and BIP143 payment size. The window iteration also selected `joint-2` for OTDA, where it still gives a 91,692 B two-input, two-output payment. [Window replay results](versions/v0.6.0/comparison.json)

        In v0.4.0, the Forth names values in the formula. After computing `xx = x1*x2` and `yy = y1*y2`, the source expresses a cross term that can be expanded algebraically:

        ```diff
        - x1 y1 int+ x2 y2 int+ int* xx int- yy int- let xy
        + x1 y2 int* x2 y1 int* int+ let xy
        ```

        Expanding all three cross terms reduces unoptimized point addition from 392 B to 345 B. Once the compiler learned that identity, the original formula compiled to 123 B with rewriting and stack scheduling enabled. The full lock from the original source measures 117,775 B with optimization off and 42,536 B with it on. The next round used the high-level double-scalar multiplication to let the compiler choose windows and specialize fixed-table additions. [Forth formulas](forth/r1.fth) · [Historical benchmarks](forth/history.md)

        </details>
    zh-CN:
      - <a name="version-history"></a>
      - <a name="forth-探索版"></a>
      - '### 实测结果'
      - '#### v0.7.0 → v0.8.0'
      - '**v0.8.0** 每个完整锁缩短 **148 B**，BIP143 ALL 付款缩短 **296 B**，两种 OTDA 付款各缩短 **1,020 B**。付款字节数按两进两出的花费交易计。
        [版本清单](versions/v0.8.0/manifest.json) · [构建与复放](forth/README.md)'
      - |-
        | 版本 | 编译器构造 | 完整锁 | BIP143 ALL 付款 | OTDA ALL 付款 | OTDA SINGLE 付款 |
        | --- | --- | ---: | ---: | ---: | ---: |
        | v0.7.0 | 仿射固定表与更短的零下标分支 | 41,262 B | 83,294 B | 94,632 B | 94,561 B |
        | **v0.8.0** | 双坐标固定表与 OTDA 片段共享 | **41,114 B** | **82,998 B** | **93,612 B** | **93,541 B** |
      - 本轮复用现有 Forth 源码。编译器利用固定生成元表非零项的 `Z=1` 证明，只存 X 和 Y。OTDA 重建程序复用重复字节片段，逐字节还原同一把锁。
        三种付款均通过 BSV Node 和独立 chain-gang 的带资金复放，选定模板也通过了 R1 验收矩阵。 [Forth 入口](forth/r1-baseline.fth)
        · [优化计划](versions/v0.8.0/plan.json) · [版本对照](versions/v0.8.0/comparison.json) · [验收矩阵](reference/acceptance.md)
      - |-
        <details>
        <summary>展开此前的版本迭代</summary>

        每行是该轮验收后选定的一个模板。付款均为两进两出。

        | 上一轮基线 | 本轮选定模板 | 主要改进 | 完整锁 | BIP143 ALL | OTDA ALL |
        | --- | --- | --- | ---: | ---: | ---: |
        | — | v0.1.0 | 初版固定锁，OTDA 直接携带原像 | 59,582 B | 119,934 B | 358,194 B |
        | v0.1.0 | v0.2.0 | 重排 P‑256 点运算，OTDA 共用曲线内核重建原像 | 46,302 B | 93,374 B | 101,250 B |
        | v0.2.0 | Forth v0.3.0 | 从 Forth 生成整锁，缩短 263 处倍点 | 45,776 B | 92,322 B | 100,192 B |
        | Forth v0.3.0 | Forth v0.4.0 | 用带范围的公式表达点运算，编译器做等价改写与栈调度 | 42,536 B | 85,842 B | 93,664 B |
        | Forth v0.4.0 | v0.5.0（`split-5x4`） | 把双标量乘法留给编译器，用 5 位固定表和 4 位公钥表减少循环点加 | 41,721 B | 84,212 B | 95,282 B |
        | v0.5.0 | v0.6.0 | 证明固定生成元表非零项满足 `Z=1`，特化 51 处点加 | 41,364 B | 83,498 B | 94,864 B |
        | v0.6.0 | v0.7.0 | 缩短每次固定生成元查表的零下标分支 | 41,262 B | 83,294 B | 94,632 B |

        主线以锁和 BIP143 付款字节数选版。以 OTDA 付款为首要目标时，沿用窗口迭代选出的 `joint-2`，两进两出 OTDA ALL 为 91,692 B。 [窗口复放数据](versions/v0.6.0/comparison.json)

        v0.4.0 的 Forth 用命名值写公式，例如先算 `xx = x1*x2` 和 `yy = y1*y2`，再写交叉项。代数上可展开为两个交叉乘积：

        ```diff
        - x1 y1 int+ x2 y2 int+ int* xx int- yy int- let xy
        + x1 y2 int* x2 y1 int* int+ let xy
        ```

        对三个交叉项都这样展开，关闭优化时点加从 392 B 降到 345 B。把这一等价改写加入编译器后，保留原式并开启优化，配合栈调度就能生成 123 B 的点加和 42,536 B 的完整锁。同一份源码关闭优化时，完整锁为 117,775 B。下一轮继续用高阶双标量乘法表达算法，把窗口和固定表特化交给编译器。 [公式源码](forth/r1.fth) · [历史基准](forth/history.md)

        </details>
